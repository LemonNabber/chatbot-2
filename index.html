    add('monitor', 'Back to your conversation', () => { if (inArchive()) leaveArchive(0); });
    if (isVisible()) add('floppy', 'Map: the conversations used along your trail', toggleMap);
  }
  renderDock();

  // ---------- contributors (whose words the bot reused), most recent first ----------
  let archiveContributors = [];
  function currentContributors() {
    if (inArchive()) return archiveContributors;
    const seen = new Map();
    for (let i = state.rows.length - 1; i >= 0; i--) {
      const s = state.rows[i].source;
      if (s && !seen.has(s.convId)) seen.set(s.convId, { convId: s.convId, name: s.name, photoPath: s.photoPath, messageId: s.messageId });
    }
    return [...seen.values()];
  }
  function selectContributor(convId) {
    state.selected = convId;
    renderHeader();
    renderSidebar();
  }

  // ---------- header: bot face (left), card, your face (right) ----------
  let headerToken = 0;
  async function renderHeader() {
    if (!state.conversationId) return;
    const token = ++headerToken;
    const contributors = currentContributors();
    if (!contributors.some(c => c.convId === state.selected)) state.selected = contributors[0]?.convId || null;
    const sel = contributors.find(c => c.convId === state.selected);

    let card, leftUrl = null, rightUrl = null, leftBlack = false;
    if (inArchive()) {
      const here = state.path[state.path.length - 1];
      const info = await getCard(here.convId, { name: here.name });
      if (token !== headerToken) return;
      card = cardEl(info, { showNumber: true });
      rightUrl = info && await getPhotoUrl(info.photoPath);
      leftUrl = sel && await getPhotoUrl(sel.photoPath);
    } else {
      card = cardEl(ownCardInfo(), { showNumber: state.mode === 'visible' });
      rightUrl = state.photoUrl;
      if (state.mode === 'obscured') leftBlack = true;
      else leftUrl = sel && await getPhotoUrl(sel.photoPath);
    }
    if (token !== headerToken) return;
    $('head-card').replaceChildren(card);
    setPortrait($('face-left'), leftUrl, leftBlack);
    setPortrait($('face-right'), rightUrl, false);
  }
  function setPortrait(box, url, black) {
    box.classList.toggle('bot-hidden', !!black);
    const cur = box.querySelector('img');
    if (black || !url) { box.replaceChildren(); return; }
    if (cur && cur.dataset.photo === url) return;
    box.replaceChildren(portraitImg(url));
  }

  // ---------- dot filter: every photo on the page is shown this way ----------
  // The photo is reduced to a coarse grid (cols across). Each cell either gets a dot or not,
  // and every dot is the same size: darker areas simply get more dots (ordered dithering
  // with a 4x4 Bayer pattern). Dots are dark on transparent, so the box behind them (sage
  // glass, or the portrait tint) shows between. The original photo is never displayed.
  // Each version is made once and kept in memory, like the photos themselves.
  const DOTS = { ink: '#1f2622', size: 0.78, contrast: 1.4, cellPx: 8 };
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
  const dotCache = new Map();
  function dotPhoto(url, { cols = 36, aspect = 1 } = {}) {
    const key = url + '|' + cols + '|' + aspect;
    if (!dotCache.has(key)) dotCache.set(key, new Promise(resolve => {
      const im = new Image();
      im.onload = () => {
        const rows = Math.max(1, Math.round(cols / aspect));
        // 1. shrink the photo (cover-cropped) to one pixel per cell
        const small = document.createElement('canvas'); small.width = cols; small.height = rows;
        const sx = small.getContext('2d', { willReadFrequently: true });
        sx.imageSmoothingQuality = 'high';
        const scale = Math.max(cols / im.width, rows / im.height);
        const dw = im.width * scale, dh = im.height * scale;
        sx.drawImage(im, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
        const px = sx.getImageData(0, 0, cols, rows).data;
        // auto levels: stretch this photo's own darkest..lightest (2%..98%) to full range,
        // so a dim or flat photo still reads clearly at this low resolution
        const L = [];
        for (let i = 0; i < px.length; i += 4) L.push((0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / 255);
        const sorted = L.slice().sort((a, b) => a - b);
        const lo = sorted[Math.floor(sorted.length * 0.02)], hi = sorted[Math.floor(sorted.length * 0.98)];
        const span = Math.max(0.08, hi - lo);
        // 2. one same-size dot per cell that is dark enough
        const c = DOTS.cellPx, r = c * DOTS.size / 2;
        const out = document.createElement('canvas'); out.width = cols * c; out.height = rows * c;
        const ox = out.getContext('2d'); ox.fillStyle = DOTS.ink;
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          let d = 1 - Math.min(1, Math.max(0, (L[y * cols + x] - lo) / span));
          d = (d - 0.5) * DOTS.contrast + 0.5;
          if (d > BAYER[(y % 4) * 4 + (x % 4)]) { ox.beginPath(); ox.arc(x * c + c / 2, y * c + c / 2, r, 0, Math.PI * 2); ox.fill(); }
        }
        resolve(out.toDataURL('image/png'));
      };
      im.onerror = () => resolve(null);
      im.src = url;
    }));
    return dotCache.get(key);
  }

  // ---------- cartridges (the photo slots in the sidebar) ----------
  // Filled slots use the cartridge art in assets/id card.svg; empty ones are its outline.
  const CART_ART = 'assets/id%20card.svg';
  const CART_SHELL = 'M152.516 33.5095C154.305 35.2087 155.318 37.5682 155.318 40.0358V62.3013C155.318 63.1495 154.862 63.9322 154.124 64.3501C153.386 64.768 152.93 65.5507 152.93 66.3989V73.8874C152.93 74.8968 153.365 75.8571 154.124 76.5225C154.883 77.1878 155.318 78.1482 155.318 79.1575V171.446C155.318 173.103 153.975 174.446 152.318 174.446H19.9004C18.2437 174.446 16.9005 173.103 16.9004 171.446V168.963C16.9004 168.113 17.3563 167.328 18.0947 166.907C18.8331 166.486 19.2891 165.702 19.2891 164.852V141.361C19.2891 140.513 18.8328 139.73 18.0947 139.312C17.3566 138.894 16.9004 138.111 16.9004 137.263V12C16.9004 10.3432 18.2436 9.00005 19.9004 9H123.113C125.419 9 127.638 9.88548 129.31 11.4737L152.516 33.5095Z';
  function cartridgeSVG(kind) {
    if (kind === 'empty') {
      return `<svg viewBox="16.9 9 138.4 165.4" aria-hidden="true"><path d="${CART_SHELL}" fill="none" stroke="#222" stroke-width="1.6"/></svg>`;
    }
    return `<img class="cart-art" src="${CART_ART}" alt="" draggable="false">`;
  }

  // ---------- sidebar ----------
  let sidebarToken = 0;
  async function renderSidebar() {
    if (!isVisible() || !state.conversationId) return;
    const token = ++sidebarToken;
    const contributors = currentContributors();
    const people = $('people');
    people.replaceChildren();
    contributors.slice(0, 7).forEach(c => {
      const b = el('button', c.convId === state.selected ? 'sel' : '');
      b.innerHTML = ICON.person; b.setAttribute('aria-label', c.name); b.title = c.name;
      b.addEventListener('click', () => selectContributor(c.convId));
      people.appendChild(b);
    });
    people.appendChild(el('span', 'count', String(contributors.length)));

    const slots = $('slots');
    slots.replaceChildren();
    const nf = Math.min(3, Math.ceil(contributors.length / 2)); // rows that hold a cartridge
    for (let i = 0; i < 6; i++) {
      const c = contributors[i];
      const slot = el('div', 'slot');
      const row = Math.floor(i / 2); // fill from the bottom row up
      slot.style.setProperty('--row', row);
      slot.style.setProperty('--col', i % 2);
      slot.dataset.row = row;
      if (row >= nf) {
        // a whole row still waiting for cartridges: drawn above the stack, never overlapping
        slot.classList.add('future');
        slot.style.setProperty('--nf', nf);
        slot.style.setProperty('--has', nf ? 1 : 0);
        slot.style.setProperty('--k', 3 - nf);
        slot.style.setProperty('--e', row - nf);
      }
      slot.style.zIndex = String(c ? 10 - row : 1); // lower rows in front
      const cart = el('div', 'cart');
      const sel = !!c && c.convId === state.selected;
      cart.innerHTML = cartridgeSVG(!c ? 'empty' : sel ? 'sel' : row);
      slot.appendChild(cart);
      if (c) {
        slot.classList.add('filled');
        if (sel) slot.classList.add('sel');
        slot.title = c.name;
        slot.setAttribute('aria-label', c.name);
        slot.addEventListener('click', () => selectContributor(c.convId));
        // every cartridge shows its person, printed in dots on the label
        const label = el('div', 'label');
        cart.appendChild(label);
        getPhotoUrl(c.photoPath).then(url => url && dotPhoto(url, { cols: 26, aspect: 1.054 })).then(src => {
          if (src && token === sidebarToken) { const img = el('img'); img.alt = ''; img.src = src; label.appendChild(img); }
        });
      }
      slots.appendChild(slot);
    }

    const sel = contributors.find(c => c.convId === state.selected);
    if (!sel) { $('side-card').replaceChildren(); return; }
    const info = await getCard(sel.convId, { name: sel.name });
    if (token === sidebarToken) $('side-card').replaceChildren(cardEl(info, { showNumber: true }));
  }

  // ---------- message rows ----------
  // sender 'user' = typed by the person whose conversation this is -> data font
  // sender 'bot'  = what the bot said to them                       -> friend font
  function makeRow(sender, label) {
    const row = el('div', 'row px ' + sender);
    const lab = el('div', 'row-label px-t', label);
    const msg = el('div', 'row-msg px-t ' + (sender === 'user' ? 'f-data' : 'f-friend'));
    row.append(lab, msg);
    return { row, lab, msg };
  }

  function ownLabel(sender, source) {
    if (sender === 'user') return state.mode === 'visible' ? state.name : 'YOU';
    return state.mode === 'visible' && source ? source.name : 'BOT';
  }
  function ownRowsRelabel() {
    state.rows.forEach(r => { if (r.lab) r.lab.textContent = ownLabel(r.sender, r.source); });
  }

  // A bot row with a source can be SELECTED (visible / archive only): it opens into a
  // source block with the card and ENTER ARCHIVE. One selected message per list.
  // In your own chat the newest bot message is selected automatically; clicking another
  // one selects it until you click a different one or a new bot message arrives.
  function wrapSource(rowEl, source) {
    const group = el('div', 'src-group');
    group.source = source;
    group.appendChild(rowEl);
    rowEl.addEventListener('click', () => { if (isVisible()) selectMessage(group); });
    return group;
  }

  function selectMessage(group, { animate = true } = {}) {
    const list = group.parentElement;
    if (list) list.querySelectorAll('.src-group.open, .src-group.opening').forEach(g => { if (g !== group) closeSource(g, { animate }); });
    selectContributor(group.source.convId);
    if (!group.classList.contains('open') && !group.classList.contains('opening')) openSource(group, { animate });
    // remember the last message selected in this conversation (for the data window)
    const inArch = group.closest('#list-archive') && state.path.length;
    lastSelected.set(inArch ? state.path[state.path.length - 1].convId : state.conversationId, group.source);
    scheduleData();
  }
  function unselectMessages(list) {
    list.querySelectorAll('.src-group.open, .src-group.opening').forEach(g => closeSource(g, { animate: false }));
  }
  function selectNewestOwn() {
    const groups = listOwn.querySelectorAll('.src-group');
    if (groups.length) selectMessage(groups[groups.length - 1]);
  }

  // ---- the open / close animation ("smart transition") ----
  // The frame grows out of the row's own outline: height, padding, border and background
  // move together, then the receipt and context line fade down into place. Closing is the
  // same in reverse. Data is fetched first so nothing jumps mid-animation.
  const SRC_MS = 380, SRC_EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frameStyle(group) {
    const cs = getComputedStyle(group);
    return {
      height: group.offsetHeight + 'px',
      paddingTop: cs.paddingTop, paddingRight: cs.paddingRight, paddingBottom: cs.paddingBottom, paddingLeft: cs.paddingLeft,
      borderColor: cs.borderTopColor, backgroundColor: cs.backgroundColor
    };
  }
  // Animate the group between two frame styles, keeping the newest message in view.
  function animateFrame(group, from, to, done) {
    if (group.anim) group.anim.cancel();
    const follow = group === listOwn.lastElementChild;
    group.style.overflow = 'hidden';
    const anim = group.animate([from, to], { duration: reduceMotion() ? 0 : SRC_MS, easing: SRC_EASE });
    group.anim = anim;
    if (follow) (function stick() { scrollOwn(); if (group.anim === anim && anim.playState === 'running') requestAnimationFrame(stick); })();
    anim.onfinish = () => { group.style.overflow = ''; group.anim = null; if (follow) scrollOwn(); done && done(); };
    anim.oncancel = () => { group.style.overflow = ''; };
  }
  function fadeParts(parts, dir) {
    if (reduceMotion()) return;
    const kf = [{ opacity: 0, transform: 'translateY(-0.4rem)' }, { opacity: 1, transform: 'none' }];
    parts.forEach((n, i) => n.animate(dir === 'in' ? kf : kf.slice().reverse(),
      { duration: dir === 'in' ? 300 : 180, delay: dir === 'in' ? 120 + i * 60 : 0, easing: SRC_EASE, fill: dir === 'in' ? 'backwards' : 'forwards' }));
  }

  function closeSource(group, { animate = true } = {}) {
    group.selToken = (group.selToken || 0) + 1; // cancels an open that is still loading
    group.classList.remove('opening');
    if (!group.classList.contains('open')) return;
    const parts = [...group.querySelectorAll('.src-head, .row.context')];
    const finish = () => { group.classList.remove('open'); parts.forEach(n => n.remove()); };
    if (!animate || reduceMotion()) { if (group.anim) group.anim.cancel(); finish(); return; }
    const from = frameStyle(group);
    finish();                       // measure the closed state...
    const to = frameStyle(group);
    group.classList.add('open');    // ...then put the parts back for the animation
    parts.forEach((n, i) => i === 0 ? group.prepend(n) : parts[i - 1].after(n));
    fadeParts(parts, 'out');
    animateFrame(group, from, to, finish);
    // during the animation the group shows the closed padding/colours from the keyframes
  }

  async function openSource(group, { animate = true } = {}) {
    const source = group.source;
    const token = group.selToken = (group.selToken || 0) + 1;
    group.classList.add('opening');
    const [info, ctx] = await Promise.all([getCard(source.convId, { name: source.name }), getContext(source.messageId)]);
    if (group.selToken !== token) return; // unselected while loading
    group.classList.remove('opening');

    const head = el('div', 'src-head');
    const enter = el('button', 'enter px', 'Enter archive ↗');
    enter.addEventListener('click', e => { e.stopPropagation(); enterArchive(source.convId, source.name, source.messageId); });
    head.append(el('div', '', ''), enter);
    head.firstChild.appendChild(cardEl(info, { showNumber: true, oneLine: true }));
    const parts = [head];
    let ctxRow = null;
    if (ctx) {
      // The line that prompted the reused reply. Never seen in this chat, so shown as raw data.
      const { row, msg } = makeRow('user', ctx.sender === 'bot' ? 'BOT' : source.name);
      row.classList.add('context');
      msg.textContent = ctx.content;
      ctxRow = row;
      parts.push(row);
    }

    const from = frameStyle(group);
    group.prepend(...parts);
    group.classList.add('open');
    if (!animate || reduceMotion()) { if (group === listOwn.lastElementChild) scrollOwn(); return; }
    const to = frameStyle(group);
    fadeParts(parts, 'in');
    animateFrame(group, from, to);
  }

  // ---------- sending ----------
  const listOwn = $('list-own');
  const scrollOwn = () => { listOwn.scrollTop = listOwn.scrollHeight; };

  // Bot timing: a pause after your message finishes, then the row eases in,
  // then a beat before it starts talking.
  const BOT_PAUSE_MS = 700, BOT_SLIDE_MS = 420, BOT_BEAT_MS = 180;

  function appendOwnRow(sender, text, source, pitchFn) {
    const { row, lab, msg } = makeRow(sender, ownLabel(sender, source));
    state.rows.push({ sender, text, at: new Date(), source, lab });
    const node = source ? wrapSource(row, source) : row;
    enqueueSpeech(async () => {
      if (sender === 'bot') {
        await wait(BOT_PAUSE_MS);
        node.classList.add('slide-in');
        node.addEventListener('animationend', () => node.classList.remove('slide-in'), { once: true });
      }
      listOwn.appendChild(node);
      scrollOwn();
      renderHeader();
      if (isVisible() && source) renderSidebar();
      if (sender === 'bot') await wait(BOT_SLIDE_MS + BOT_BEAT_MS);
      await typeOut(msg, text, pitchFn, scrollOwn);
      // In visible mode a new bot message becomes selected once it has been read out:
      // its frame, receipt and ENTER ARCHIVE grow in then.
      if (source && state.mode === 'visible' && !inArchive() && node === listOwn.lastElementChild) {
        await wait(BOT_BEAT_MS);
        if (state.mode === 'visible' && !inArchive()) selectMessage(node);
      }
    });
  }

  async function sendMessage(text) {
    text = text.trim();
    if (!text || !state.conversationId) return;
    getAudioCtx();
    if (!$('chat-empty').hidden) {
      $('chat-empty').hidden = true;
      $('chat-main').hidden = false;
      $('message-input').focus();
    }

    appendOwnRow('user', text, null, () => state.voicePitch);

    const { error: insertErr } = await supabaseClient.from('messages').insert({ conversation_id: state.conversationId, sender: 'user', content: text });
    if (insertErr) { console.error(insertErr); return; }

    const { data, error } = await supabaseClient.rpc('find_best_response', { input_text: text, current_conversation_id: state.conversationId });
    if (error || !data || !data.length) {
      if (error) console.error(error);
      appendOwnRow('bot', "Hm, I don't know what to say to that.", null, () => DEFAULT_VOICE_PITCH);
      return;
    }
    const reply = data[0];

    // Save the bot line BEFORE showing it: the photo policy only allows a photo
    // once a saved bot message points at that person's words.
    const { error: botErr } = await supabaseClient.from('messages').insert({
      conversation_id: state.conversationId, sender: 'bot', content: reply.response_text, source_message_id: reply.response_id
    });
    if (botErr) console.error(botErr);
    scheduleData();

    const source = {
      convId: reply.source_conversation_id, name: reply.source_display_name, messageId: reply.response_id,
      photoPath: reply.source_photo_path, voicePitch: reply.source_voice_pitch, mood: reply.source_mood
    };
    // Bot voice: one default voice in obscured mode, the source person's voice in visible mode.
    appendOwnRow('bot', reply.response_text, source, () => (isVisible() && source.voicePitch) || DEFAULT_VOICE_PITCH);
  }

  for (const id of ['start-input', 'message-input']) {
    $(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') { const t = e.target.value; e.target.value = ''; sendMessage(t); }
    });
  }

  // ============================================================
  // DATA WINDOW
  // The conversations you have tracked through (your own, then each archive you entered),
  // printed as raw data. In each one, the last message you selected shows a snapshot of
  // the line it reused: the matched line, the similarity, and the predicted response.
  // ============================================================
  const lastSelected = new Map();   // conversation id -> source of the last selected bot message
  const transcriptCache = new Map(); // other people's conversations don't change while you look
  const snapshotCache = new Map();
  const datawin = $('datawin');
  let dataToken = 0;

  // ---------- floating windows (DATA, MAP): movable, click to bring to front ----------
  let zTop = 60;
  function bringToFront(node) { node.style.zIndex = String(++zTop); }
  $('window').addEventListener('pointerdown', () => bringToFront($('desktop')));

  function floating(win, tabId, closeId, render, place) {
    let timer = null, placed = false;
    const api = {
      toggle() {
        win.hidden = !win.hidden;
        if (win.hidden) return;
        bringToFront(win); // a newly opened window comes to the front
        if (!placed) { placed = true; place(win); }
        api.keep();
        render();
      },
      schedule() {
        if (win.hidden) return;
        clearTimeout(timer);
        timer = setTimeout(render, 150);
      },
      // never let the window end up out of reach (after a resize, or when first placed)
      keep() {
        if (win.hidden) return;
        const r = win.getBoundingClientRect();
        win.style.left = Math.min(Math.max(16, r.left), Math.max(16, innerWidth - r.width - 16)) + 'px';
        win.style.top = Math.min(Math.max(0, r.top), Math.max(0, innerHeight - 60)) + 'px';
      }
    };
    $(closeId).addEventListener('click', () => { win.hidden = true; });
    win.addEventListener('pointerdown', () => bringToFront(win));
    addEventListener('resize', api.keep);
    // drag by the tab
    const tab = $(tabId);
    let sx, sy, ox, oy, dragging = false;
    tab.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      dragging = true; tab.setPointerCapture(e.pointerId);
      sx = e.clientX; sy = e.clientY; ox = win.offsetLeft; oy = win.offsetTop;
    });
    tab.addEventListener('pointermove', e => {
      if (!dragging) return;
      win.style.left = Math.min(innerWidth - 80, Math.max(80 - win.offsetWidth, ox + e.clientX - sx)) + 'px';
      win.style.top = Math.min(innerHeight - 40, Math.max(0, oy + e.clientY - sy)) + 'px';
    });
    const stop = () => { dragging = false; };
    tab.addEventListener('pointerup', stop); tab.addEventListener('pointercancel', stop);
    return api;
  }

  const dataWin = floating(datawin, 'dw-tab', 'dw-close', () => renderData(), w => {
    w.style.left = Math.max(16, innerWidth - w.getBoundingClientRect().width - 24) + 'px'; w.style.top = '24px';
  });
  const toggleData = () => dataWin.toggle();
  // anything that changes what the windows show calls this
  function scheduleData() { dataWin.schedule(); mapWin.schedule(); }

  async function fetchTranscript(convId, fresh) {
    if (fresh || !transcriptCache.has(convId)) {
      const p = supabaseClient.rpc('get_conversation_transcript', { target_conversation_id: convId })
        .then(({ data, error }) => { if (error) { console.error(error); transcriptCache.delete(convId); return null; } return data || []; });
      transcriptCache.set(convId, p);
    }
    return transcriptCache.get(convId);
  }
  // The reused line and the line before it, with ids and positions (supabase/data.sql).
  // Without that function, falls back to the context line (no ids).
  function getSnapshot(messageId) {
    if (!snapshotCache.has(messageId)) {
      snapshotCache.set(messageId, supabaseClient.rpc('get_message_snapshot', { target_message_id: messageId }).then(async ({ data, error }) => {
        if (!error && data && data.length) return data.slice().sort((a, b) => a.id - b.id);
        if (error) snapshotCache.delete(messageId);
        const ctx = await getContext(messageId);
        return ctx ? [{ id: null, sender: ctx.sender, content: ctx.content, position: null }] : [];
      }));
    }
    return snapshotCache.get(messageId);
  }

  // Conversations that started between two moments (supabase/data.sql). null if unknown.
  const gapCache = new Map();
  function countBetween(a, b) {
    if (!a || !b) return Promise.resolve(null);
    const A = new Date(a).toISOString(), B = new Date(b).toISOString();
    const key = A + '|' + B;
    if (!gapCache.has(key)) gapCache.set(key, supabaseClient.rpc('count_conversations_between', { a: A, b: B })
      .then(({ data, error }) => { if (error) { console.error(error); gapCache.delete(key); return null; } return data; }));
    return gapCache.get(key);
  }

  // Trigram similarity, the same measure Postgres (pg_trgm) uses to pick a reply.
  function trigrams(s) {
    const set = new Set();
    String(s).toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean).forEach(w => {
      const p = '  ' + w + ' ';
      for (let i = 0; i < p.length - 2; i++) set.add(p.slice(i, i + 3));
    });
    return set;
  }
  function similarity(a, b) {
    const A = trigrams(a), B = trigrams(b);
    if (!A.size || !B.size) return 0;
    let shared = 0; A.forEach(t => { if (B.has(t)) shared++; });
    return shared / (A.size + B.size - shared);
  }

  const pad = n => String(n).padStart(2, '0');
  const dDate = (d, short) => { d = new Date(d); return pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + '/' + (short ? pad(d.getFullYear() % 100) : d.getFullYear()); };
  const dTime = d => { d = new Date(d); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
  const dDur = ms => fmtDuration(ms).replace(/ /g, '');
  const SENDER = s => s === 'bot' ? 'BOT' : 'USER';

  // Selecting a bot line in the data window: if that conversation is the one on screen,
  // the message there is selected too (same as clicking it); otherwise only the data
  // window's snapshot changes.
  function pickFromData(convId, source) {
    const viewing = inArchive() ? state.path[state.path.length - 1].convId : state.conversationId;
    const list = convId === viewing ? (inArchive() ? $('list-archive') : listOwn) : null;
    const group = list && [...list.querySelectorAll('.src-group')].reverse().find(g => g.source.messageId === source.messageId);
    if (group) {
      selectMessage(group);
      group.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } else {
      lastSelected.set(convId, source);
      scheduleData();
    }
  }

  function dwLine(prefix, id, pos, sender, content, ref) {
    const line = el('div', 'dw-line');
    [prefix, id ?? '—', pos != null ? '[' + pos + ']' : '', SENDER(sender), content, ref ? '>' + ref : ''].forEach((t, i) => {
      line.appendChild(el('span', i === 4 ? 'c' : i === 5 ? 'r' : '', String(t)));
    });
    return line;
  }

  async function renderData() {
    if (datawin.hidden || !state.conversationId) return;
    const token = ++dataToken;
    const trail = [{ convId: state.conversationId, name: state.name }].concat(state.trail.slice(1));
    const here = state.path.length; // which trail entry you are looking at now

    // load everything first, then draw in one go
    const boxes = await Promise.all(trail.map(async (t, i) => {
      const own = i === 0;
      const [rows, info] = await Promise.all([
        fetchTranscript(t.convId, own),
        own ? Object.assign(ownCardInfo(), { number: state.number }) : getCard(t.convId, { name: t.name })
      ]);
      const sel = lastSelected.get(t.convId);
      let snap = null, snapInfo = null;
      if (sel) [snap, snapInfo] = await Promise.all([getSnapshot(sel.messageId), getCard(sel.convId, { name: sel.name })]);
      return { t, rows: rows || [], info: info || { name: t.name }, sel, snap, snapInfo };
    }));
    // newest conversation on top
    const order = boxes.map((b, i) => ({ b, i })).sort((x, y) =>
      (+new Date(y.b.info.startedAt || 0)) - (+new Date(x.b.info.startedAt || 0)) || x.i - y.i).map(o => o.b);
    // how many other conversations started between each neighbouring pair
    const gaps = await Promise.all(order.slice(1).map((b, k) => countBetween(order[k].info.startedAt, b.info.startedAt)));
    if (token !== dataToken) return;

    const body = $('dw-body');
    const frag = document.createDocumentFragment();
    // path: REBECCA --> JOY --> FRIEND (the one you are looking at is bright)
    const path = el('div', 'dw-path');
    trail.forEach((t, i) => {
      if (i) path.appendChild(el('span', 'dw-dim', ' --> '));
      path.appendChild(el('span', i === here ? '' : 'dw-dim', (t.name || '').toUpperCase()));
    });
    frag.append(path, el('div', 'dw-rule'));

    order.forEach((b, i) => {
      if (i) {
        const n = gaps[i - 1];
        frag.appendChild(el('div', 'dw-gap', '[ ... ' + (n == null ? '?' : n) + ' CONVERSATION' + (n === 1 ? '' : 'S') + ' ... ]'));
      }
      const box = el('div', 'dw-conv');
      const info = b.info;
      const head = ['#' + (info.number ?? '—'), '"' + (info.name || b.t.name || '').toLowerCase() + '"'];
      if (info.startedAt) head.push(dDate(info.startedAt), dTime(info.startedAt), dDur((info.lastAt || info.startedAt) - info.startedAt));
      box.appendChild(el('div', 'dw-head', head.join(' : ')));
      const lines = el('div', 'dw-lines');
      if (!b.rows.length) lines.appendChild(el('div', 'dw-note', 'no messages saved yet'));

      // where the snapshot goes: after the line the selected reply was answering
      let botAt = -1, userAt = -1;
      if (b.sel) {
        for (let k = b.rows.length - 1; k >= 0; k--) if (b.rows[k].sender === 'bot' && b.rows[k].source_message_id === b.sel.messageId) { botAt = k; break; }
        for (let k = botAt - 1; k >= 0; k--) if (b.rows[k].sender === 'user') { userAt = k; break; }
      }
      b.rows.forEach((r, k) => {
        const last = k === b.rows.length - 1;
        const line = dwLine(last ? '└──' : '|──', r.id, k + 1, r.sender, r.content, r.sender === 'bot' ? r.source_message_id : null);
        if (r.sender === 'bot' && r.source_message_id && r.source_conversation_id) {
          line.classList.add('pick');
          if (k === botAt) line.classList.add('sel');
          line.title = 'Select this message';
          const src = { convId: r.source_conversation_id, name: r.source_display_name, messageId: r.source_message_id, photoPath: r.source_photo_path, mood: r.source_mood };
          line.addEventListener('click', () => pickFromData(b.t.convId, src));
        }
        lines.appendChild(line);
        if (k === userAt && b.snap) {
          const m2 = b.snap.find(x => x.id === b.sel.messageId) || b.snap[b.snap.length - 1];
          const m1 = b.snap.length > 1 ? b.snap[0] : (b.snap[0] && b.snap[0].id !== b.sel.messageId ? b.snap[0] : null);
          const pct = m1 ? Math.round(similarity(r.content, m1.content) * 100) : 0;
          lines.appendChild(el('div', 'dw-match',
            '|      └→ ' + (m1 ? (m1.id ?? '—') + ' ' + pct + '% SIMILARITY | ' : '') + 'PREDICTED RESPONSE : ' + b.sel.messageId));
          const wrap = el('div', 'dw-snap');
          const sbox = el('div', 'dw-conv');
          const si = b.snapInfo || { name: b.sel.name };
          const sh = ['#' + (si.number ?? '—'), '"' + (si.name || b.sel.name || '').toLowerCase() + '"'];
          if (si.startedAt) sh.push(dDate(si.startedAt, true), dTime(si.startedAt));
          sbox.appendChild(el('div', 'dw-head', sh.join(' : ') + ' [snapshot]'));
          const sl = el('div', 'dw-lines');
          const snapRows = m1 ? [m1, { id: b.sel.messageId, sender: 'user', content: m2 && m2.id === b.sel.messageId ? m2.content : (b.rows[botAt] || {}).content, position: m2 && m2.id === b.sel.messageId ? m2.position : null }] : [{ id: b.sel.messageId, sender: 'user', content: (b.rows[botAt] || {}).content, position: null }];
          snapRows.forEach((x, j) => sl.appendChild(dwLine(j === snapRows.length - 1 ? '└──' : '|──', x.id, x.position, x.sender, x.content, null)));
          sbox.appendChild(sl);
          wrap.appendChild(sbox);
          lines.appendChild(wrap);
        }
      });
      box.appendChild(lines);
      frag.appendChild(box);
    });
    body.replaceChildren(frag);
  }

  // ============================================================
  // MAP WINDOW
  // Every conversation you have opened (the trail) and every conversation whose words
  // they used, on a timeline: newest at the top. The open conversation is the big square.
  // The trail and the selected message's source ping in turn, down the line.
  // ============================================================
  const mapwin = $('mapwin');
  const mapWin = floating(mapwin, 'mw-tab', 'mw-close', () => renderMap(), w => { w.style.left = '24px'; w.style.top = '24px'; });
  const toggleMap = () => mapWin.toggle();
  let mapToken = 0, pingTimer = null;
  const SVGNS = 'http://www.w3.org/2000/svg';
  const linkCount = new Map(); // conversation id -> how many conversations it used

  async function countLinks(convId) {
    if (!linkCount.has(convId)) linkCount.set(convId, fetchTranscript(convId).then(rows =>
      new Set((rows || []).map(r => r.source_conversation_id).filter(Boolean)).size));
    return linkCount.get(convId);
  }

  async function renderMap() {
    if (mapwin.hidden || !state.conversationId) return;
    const token = ++mapToken;
    const trail = [{ convId: state.conversationId, name: state.name }].concat(state.trail.slice(1));
    const currentId = trail[Math.min(state.path.length, trail.length - 1)].convId;
    const sel = lastSelected.get(currentId);

    // nodes and edges: each opened conversation -> every conversation it used
    const nodes = new Map(), edges = new Map();
    const addNode = (id, name) => { if (id && !nodes.has(id)) nodes.set(id, { id, name }); return nodes.get(id); };
    trail.forEach(t => addNode(t.convId, t.name).opened = true);
    const transcripts = await Promise.all(trail.map((t, i) => fetchTranscript(t.convId, i === 0)));
    trail.forEach((t, i) => (transcripts[i] || []).forEach(r => {
      if (!r.source_conversation_id || r.source_conversation_id === t.convId) return;
      addNode(r.source_conversation_id, r.source_display_name);
      edges.set(t.convId + '>' + r.source_conversation_id, { from: t.convId, to: r.source_conversation_id });
    }));
    if (sel) { addNode(sel.convId, sel.name); edges.set(currentId + '>' + sel.convId, { from: currentId, to: sel.convId }); }

    // details for every node (cards are cached)
    await Promise.all([...nodes.values()].map(async n => {
      if (n.id === state.conversationId) {
        Object.assign(n, ownCardInfo(), { number: state.number, name: state.name, photoUrl: state.photoUrl });
      } else {
        const c = await getCard(n.id, { name: n.name });
        if (c) Object.assign(n, c, { name: c.name || n.name });
        n.photoUrl = n.photoPath ? await getPhotoUrl(n.photoPath) : null;
      }
      if (!n.opened) n.links = await countLinks(n.id);
      n.dots = n.photoUrl ? await dotPhoto(n.photoUrl, { cols: 22, aspect: 1 }) : null;
    }));
    // the info box: how the selected reply was chosen
    let info = null;
    if (sel) {
      const rows = transcripts[trail.findIndex(t => t.convId === currentId)] || [];
      let b = -1; for (let k = rows.length - 1; k >= 0; k--) if (rows[k].sender === 'bot' && rows[k].source_message_id === sel.messageId) { b = k; break; }
      let u = -1; for (let k = b - 1; k >= 0; k--) if (rows[k].sender === 'user') { u = k; break; }
      const snap = await getSnapshot(sel.messageId);
      const m1 = snap.length > 1 ? snap[0] : (snap[0] && snap[0].id !== sel.messageId ? snap[0] : null);
      if (u >= 0 && m1) info = { pct: Math.round(similarity(rows[u].content, m1.content) * 100), mine: rows[u].content, theirs: m1.content };
    }
    if (token !== mapToken) return;

    // ---- layout: one row per conversation, newest first
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const body = $('mw-body');
    const W = body.clientWidth;
    const list = [...nodes.values()].sort((a, b) => (+new Date(b.startedAt || 0)) - (+new Date(a.startedAt || 0)));
    // Squish the timeline so every conversation fits in the window's height. Rows are in
    // order (newest first), spaced evenly; neighbours sit in different columns, so they can
    // share height without overlapping. Scrolls only if there are very many.
    const sameDay = list.length > 0 && list.every(n => n.startedAt && new Date(n.startedAt).toDateString() === new Date(list[0].startedAt).toDateString());
    const sizeOf = n => (n.id === currentId ? 3.8 : 2.4) * rem;
    const heightOf = n => sizeOf(n) + (n.opened ? 1.9 : n.links ? 2.3 : 1.5) * rem; // square + label (+ pips)
    const first = list[0];
    const TOP = (first && first.id === currentId ? 4.6 : 3.2) * rem;   // room for the date (and a label above)
    const avail = $('mw-body').clientHeight - 0.6 * rem;
    const lastH = list.length ? heightOf(list[list.length - 1]) : 0;
    const rowStep = list.length > 1 ? Math.max(1.6 * rem, (avail - TOP - lastH) / (list.length - 1)) : 0;
    const x0 = 5 * rem, x1 = W - 4.5 * rem;
    const lanes = [0.1, 0.7, 0.3, 0.9, 0.0, 0.5];
    let lane = 0;
    list.forEach((n, i) => {
      n.current = n.id === currentId;
      n.size = sizeOf(n);
      n.y = TOP + i * rowStep;
      n.x = n.current ? x0 + (x1 - x0) * 0.33 : x0 + (x1 - x0) * lanes[lane++ % lanes.length];
      n.cx = n.x + n.size / 2; n.cy = n.y + n.size / 2;
    });
    const H = Math.max(avail, (list.length ? list[list.length - 1].y + lastH : 0) + 0.6 * rem);

    const map = el('div', 'mw-map');
    map.style.height = H + 'px';
    map.appendChild(el('div', 'mw-axis'));
    const dateLabel = (d, withYear) => (withYear ? d.getFullYear() + '\n\n' : '') + (d.getMonth() + 1) + '/' + d.getDate();
    if (sameDay) {
      // all on one day: the date once at the top, then a time stamp for each conversation
      const d = new Date(first.startedAt);
      const g = el('div', 'mw-grid'); g.style.top = (TOP - 1.2 * rem) + 'px'; map.appendChild(g);
      const t = el('div', 'mw-date', dateLabel(d, true)); t.style.top = (TOP - 1.2 * rem) + 'px'; map.appendChild(t);
      list.forEach(n => {
        const at = new Date(n.startedAt);
        const tick = el('div', 'mw-tick'); tick.style.top = n.cy + 'px'; map.appendChild(tick);
        const tm = el('div', 'mw-time', pad(at.getHours()) + ':' + pad(at.getMinutes())); tm.style.top = n.cy + 'px'; map.appendChild(tm);
      });
    } else {
      // dashed lines where the day changes, the year above the first
      let lastDay = null, lastYear = null;
      list.forEach(n => {
        if (!n.startedAt) return;
        const d = new Date(n.startedAt), day = d.toDateString();
        if (day === lastDay) return;
        const gy = n.y - (n.current ? 1.9 : 0.6) * rem;
        const g = el('div', 'mw-grid'); g.style.top = gy + 'px'; map.appendChild(g);
        const t = el('div', 'mw-date', dateLabel(d, d.getFullYear() !== lastYear)); t.style.top = gy + 'px'; map.appendChild(t);
        lastDay = day; lastYear = d.getFullYear();
      });
    }
    // lines between conversations
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('class', 'mw-edges'); svg.setAttribute('width', W); svg.setAttribute('height', H);
    edges.forEach(e => {
      const a = nodes.get(e.from), b = nodes.get(e.to);
      if (!a || !b || a.x == null || b.x == null) return;
      const chosen = sel && e.from === currentId && e.to === sel.convId;
      const line = document.createElementNS(SVGNS, 'line');
      line.setAttribute('x1', a.cx); line.setAttribute('y1', a.cy); line.setAttribute('x2', b.cx); line.setAttribute('y2', b.cy);
      line.setAttribute('stroke', '#ececec'); line.setAttribute('stroke-width', chosen ? 2.6 : 1);
      if (b.isSeed) line.setAttribute('stroke-dasharray', '5 4'); // seed conversations: dashed
      svg.appendChild(line);
      if (chosen) { // the chosen link gets a small square halfway
        const m = document.createElementNS(SVGNS, 'rect'), s = 0.75 * rem;
        m.setAttribute('x', (a.cx + b.cx) / 2 - s / 2); m.setAttribute('y', (a.cy + b.cy) / 2 - s / 2);
        m.setAttribute('width', s); m.setAttribute('height', s);
        m.setAttribute('fill', '#000'); m.setAttribute('stroke', '#fff'); m.setAttribute('stroke-width', 2);
        svg.appendChild(m);
      }
    });
    map.appendChild(svg);
    // the conversations
    list.forEach(n => {
      const node = el('div', 'mw-node' + (n.opened ? ' opened' : '') + (n.current ? ' current' : ''));
      node.style.left = n.x + 'px'; node.style.top = n.y + 'px';
      node.title = n.name || '';
      const sq = el('div', 'sq');
      if (n.dots) { const img = el('img'); img.alt = ''; img.src = n.dots; sq.appendChild(img); }
      if (n.current) sq.insertAdjacentHTML('beforeend', '<svg class="brackets" viewBox="0 0 100 100" preserveAspectRatio="none" fill="none" stroke="#000" stroke-width="2.4" vector-effect="non-scaling-stroke"><path d="M0 18V0H18M82 0H100V18M100 82V100H82M18 100H0V82" vector-effect="non-scaling-stroke"/></svg>');
      sq.appendChild(el('div', 'ring'));
      node.appendChild(sq);
      node.appendChild(el('div', 'mw-label', '#' + (n.number ?? '—') + '  ' + (n.name || '').toUpperCase()));
      if (!n.opened && n.links != null) { // how many conversations this one would lead to
        const pips = el('div', 'mw-pips');
        for (let k = 0; k < Math.min(n.links, 8); k++) pips.appendChild(el('i'));
        if (n.links > 8) pips.appendChild(el('span', '', '+' + (n.links - 8)));
        node.appendChild(pips);
      }
      n.el = node;
      map.appendChild(node);
    });
    body.replaceChildren(map);

    // info box
    const box = $('mw-info');
    box.hidden = !info;
    if (info) {
      const cur = nodes.get(currentId), src = nodes.get(sel.convId);
      box.textContent = info.pct + '% CONFIDENCE\n#' + (cur.number ?? '—') + '\n' + info.mine + '\n#' + (src.number ?? '—') + '\n' + info.theirs;
    }

    // the chain pings in turn: trail first to last, then the selected source; then a pause
    const chain = trail.map(t => nodes.get(t.convId));
    if (sel && !trail.some(t => t.convId === sel.convId)) chain.push(nodes.get(sel.convId));
    clearInterval(pingTimer);
    let step = 0;
    pingTimer = setInterval(() => {
      if (mapwin.hidden || token !== mapToken) { clearInterval(pingTimer); return; }
      const n = chain[step % (chain.length + 1)]; // one empty beat at the end of each cycle
      if (n && n.el) { n.el.classList.remove('ping'); void n.el.offsetWidth; n.el.classList.add('ping'); }
      step++;
    }, 650);

    // first open: scroll to the current conversation
    if (!body.dataset.scrolled) { body.dataset.scrolled = '1'; const c = nodes.get(currentId); body.scrollTop = Math.max(0, c.y - 4 * rem); }
  }

  // ============================================================
  // ARCHIVE
  // ============================================================
  async function enterArchive(convId, name, highlightId) {
    // the trail remembers how far you have tracked, even after you step back
    const pos = state.path.length + 1;
    if (!state.trail.length) state.trail = [{ convId: state.conversationId, name: state.name }];
    if (!state.trail[pos] || state.trail[pos].convId !== convId) state.trail = state.trail.slice(0, pos).concat([{ convId, name }]);
    state.path.push({ convId, name, highlightId });
    await renderArchive();
  }
  async function leaveArchive(level) {
    state.path = state.path.slice(0, level);
    state.trail = state.trail.slice(0, level + 1); // closed levels leave the data window too
    if (!level) { state.mode = 'visible'; renderChrome(); return; }
    await renderArchive();
  }

  async function renderArchive() {
    const here = state.path[state.path.length - 1];
    const list = $('list-archive');
    list.replaceChildren(el('div', 'row-label', 'Loading…'));
    archiveContributors = [];
    renderChrome();

    const { data, error } = await supabaseClient.rpc('get_conversation_transcript', { target_conversation_id: here.convId });
    if (state.path[state.path.length - 1] !== here) return;
    if (error || !data) { console.error(error); list.replaceChildren(el('div', 'row-label', "Couldn't load this conversation.")); return; }

    list.replaceChildren();
    let highlightEl = null;
    const seen = new Map();
    data.forEach(r => {
      // The perception rule: rows look the way this person saw them.
      const source = r.source_conversation_id ? {
        convId: r.source_conversation_id, name: r.source_display_name, messageId: r.source_message_id,
        photoPath: r.source_photo_path, mood: r.source_mood
      } : null;
      const { row, msg } = makeRow(r.sender, r.sender === 'user' ? here.name : (source ? source.name : 'BOT'));
      msg.textContent = r.content;
      if (r.id === here.highlightId) highlightEl = row;
      list.appendChild(source ? wrapSource(row, source) : row);
      if (source) { seen.delete(source.convId); seen.set(source.convId, { convId: source.convId, name: source.name, photoPath: source.photoPath, messageId: source.messageId }); }
    });
    archiveContributors = [...seen.values()].reverse();
    state.selected = archiveContributors[0]?.convId || null;
    renderHeader();
    renderSidebar();
    if (highlightEl) highlightEl.scrollIntoView({ block: 'center' });
  }

  // ============================================================
  // VOICE: pitch detection
  // ============================================================
  // Finds the pitch (Hz) of the loudest part of a recording.
  function detectPitch(samples, sampleRate) {
    const frameLen = Math.round(0.04 * sampleRate);
    const hop = Math.round(0.01 * sampleRate);
    const rms = [];
    for (let s = 0; s + frameLen <= samples.length; s += hop) {
      let sum = 0;
      for (let j = 0; j < frameLen; j++) sum += samples[s + j] * samples[s + j];
      rms.push(Math.sqrt(sum / frameLen));
    }
    if (!rms.length) return { reason: 'quiet' };
    let loudest = 0;
    for (let i = 1; i < rms.length; i++) if (rms[i] > rms[loudest]) loudest = i;
    const maxRms = rms[loudest];
    if (maxRms < 0.01) return { reason: 'quiet' };
    const pitches = [];
    const from = Math.max(0, loudest - 15), to = Math.min(rms.length - 1, loudest + 15);
    for (let i = from; i <= to; i++) {
      if (rms[i] < 0.5 * maxRms) continue;
      const p = framePitch(samples, i * hop, frameLen, sampleRate);
      if (p) pitches.push(p);
    }
    if (pitches.length < 3) return { reason: 'unclear' };
    pitches.sort((a, b) => a - b);
    return { pitch: pitches[Math.floor(pitches.length / 2)] };
  }

  // Pitch of one slice, or null if it isn't clearly voiced. Range: 70-500 Hz.
  function framePitch(x, start, n, sampleRate) {
    const minLag = Math.floor(sampleRate / 500);
    const maxLag = Math.ceil(sampleRate / 70);
    const w = n - maxLag - 1; // compare equal-length windows for every lag
    if (w <= 0) return null;
    const corr = new Float32Array(maxLag + 2);
    let best = -1;
    for (let lag = minLag; lag <= maxLag + 1; lag++) {
      let num = 0, e1 = 0, e2 = 0;
      for (let j = 0; j < w; j++) {
        const a = x[start + j], b = x[start + j + lag];
        num += a * b; e1 += a * a; e2 += b * b;
      }
      const r = (e1 && e2) ? num / Math.sqrt(e1 * e2) : 0;
      corr[lag] = r;
      if (lag <= maxLag && r > best) best = r;
    }
    if (best < 0.6) return null;
    // first peak that is nearly as strong as the best one (avoids octave errors)
    for (let lag = minLag + 1; lag <= maxLag; lag++) {
      if (corr[lag] >= 0.9 * best && corr[lag] >= corr[lag - 1] && corr[lag] >= corr[lag + 1]) {
        const y0 = corr[lag - 1], y1 = corr[lag], y2 = corr[lag + 1];
        const denom = y0 - 2 * y1 + y2;
        const shift = denom ? (y0 - y2) / (2 * denom) : 0;
        return sampleRate / (lag + shift);
      }
    }
    return null;
  }

  // ============================================================
  // VOICE: letter sounds (Animalese-style)
  // Each letter is a tiny syllable at the speaker's pitch: a vowel colour
  // (from how the letter's name sounds), an onset, and its own pitch step.
  // ============================================================
  const VOWEL_FORMANTS = { a: [730, 1090], e: [530, 1840], i: [270, 2290], o: [570, 840], u: [300, 870] };
  const LETTER_SOUNDS = {
    a: { v: 'e', on: 'none', st: 0 }, b: { v: 'i', on: 'pop', st: 2 }, c: { v: 'i', on: 'hiss', st: -1 },
    d: { v: 'i', on: 'pop', st: -2 }, e: { v: 'i', on: 'none', st: 3 }, f: { v: 'e', on: 'soft', st: -1 },
    g: { v: 'i', on: 'sh', st: 1 }, h: { v: 'e', on: 'soft', st: 2 }, i: { v: 'a', on: 'none', st: 1 },
    j: { v: 'e', on: 'sh', st: -2 }, k: { v: 'e', on: 'pop', st: 3 }, l: { v: 'e', on: 'liquid', st: -1 },
    m: { v: 'e', on: 'nasal', st: -3 }, n: { v: 'e', on: 'nasal', st: 0 }, o: { v: 'o', on: 'none', st: -1 },
    p: { v: 'i', on: 'pop', st: 0 }, q: { v: 'u', on: 'pop', st: 2 }, r: { v: 'a', on: 'liquid', st: -2 },
    s: { v: 'e', on: 'hiss', st: 1 }, t: { v: 'i', on: 'pop', st: 4 }, u: { v: 'u', on: 'none', st: 2 },
    v: { v: 'i', on: 'liquid', st: -3 }, w: { v: 'u', on: 'liquid', st: 0 }, x: { v: 'e', on: 'hiss', st: -2 },
    y: { v: 'a', on: 'liquid', st: 3 }, z: { v: 'i', on: 'hiss', st: 2 }
  };
  const OTHER_SOUND = { v: 'o', on: 'pop', st: 0 };
  const ONSETS = {
    pop:  { type: 'bandpass', freq: 3000, q: 1, peak: 0.6, len: 0.015, delay: 0.01 },
    hiss: { type: 'highpass', freq: 5000, q: 0.7, peak: 0.35, len: 0.035, delay: 0.025 },
    sh:   { type: 'bandpass', freq: 2500, q: 2, peak: 0.4, len: 0.035, delay: 0.025 },
    soft: { type: 'bandpass', freq: 1400, q: 1, peak: 0.25, len: 0.03, delay: 0.02 }
  };

  let audioCtx = null, masterGain = null, noiseBuffer = null;
  function getAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      const compressor = audioCtx.createDynamicsCompressor();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.6;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);
      noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const d = noiseBuffer.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playLetter(ch, basePitch, dur, bendSemitones) {
    const ctx = getAudioCtx();
    const s = LETTER_SOUNDS[ch] || OTHER_SOUND;
    const [f1, f2] = VOWEL_FORMANTS[s.v];
    const freq = basePitch * VOICE_PITCH_MULTIPLIER * Math.pow(2, (s.st + bendSemitones) / 12);
    const t = ctx.currentTime + 0.005;
    const onset = ONSETS[s.on];
    if (onset) {
      const src = ctx.createBufferSource(); src.buffer = noiseBuffer;
      const filt = ctx.createBiquadFilter(); filt.type = onset.type; filt.frequency.value = onset.freq; filt.Q.value = onset.q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(onset.peak, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + onset.len);
      src.connect(filt); filt.connect(g); g.connect(masterGain);
      src.start(t, Math.random() * 0.5); src.stop(t + onset.len + 0.01);
    }
    const vs = t + (onset ? onset.delay : 0);
    const vd = Math.max(0.03, dur * 1.1 - (vs - t));
    const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = freq;
    const bp1 = ctx.createBiquadFilter(); bp1.type = 'bandpass'; bp1.frequency.value = f1; bp1.Q.value = 5;
    const bp2 = ctx.createBiquadFilter(); bp2.type = 'bandpass'; bp2.frequency.value = f2; bp2.Q.value = 7;
    const body = ctx.createBiquadFilter(); body.type = 'lowpass'; body.frequency.value = 1200;
    if (s.on === 'liquid' || s.on === 'nasal') {
      bp2.frequency.setValueAtTime(f2 * 0.6, vs); bp2.frequency.linearRampToValueAtTime(f2, vs + 0.03);
      if (s.on === 'nasal') { bp1.frequency.setValueAtTime(250, vs); bp1.frequency.linearRampToValueAtTime(f1, vs + 0.03); }
    }
    const g1 = ctx.createGain(); g1.gain.value = 2.5;
    const g2 = ctx.createGain(); g2.gain.value = 1.8;
    const gb = ctx.createGain(); gb.gain.value = 0.15;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, vs); env.gain.linearRampToValueAtTime(1, vs + 0.008);
    env.gain.setValueAtTime(1, vs + vd * 0.55); env.gain.exponentialRampToValueAtTime(0.0001, vs + vd);
    osc.connect(bp1); bp1.connect(g1); g1.connect(env);
    osc.connect(bp2); bp2.connect(g2); g2.connect(env);
    osc.connect(body); body.connect(gb); gb.connect(env);
    env.connect(masterGain);
    osc.start(vs); osc.stop(vs + vd + 0.01);
    osc.onended = () => env.disconnect();
  }

  // Types text into an element one character at a time, playing a sound per letter.
  function typeOut(target, text, getPitch, onChar) {
    const chars = Array.from(text);
    const isLetter = c => /[\p{L}\p{N}]/u.test(c);
    const totalLetters = chars.filter(isLetter).length;
    const endsWithQuestion = /\?\s*$/.test(text);
    const step = Math.min(0.07, Math.max(0.035, 9 / chars.length));
    const pitch = getPitch() || DEFAULT_VOICE_PITCH;
    return new Promise(resolve => {
      let i = 0, lettersSoFar = 0;
      function tick() {
        if (i >= chars.length) { resolve(); return; }
        const ch = chars[i++];
        target.textContent += ch;
        let delay = step;
        if (isLetter(ch)) {
          lettersSoFar++;
          let bend = 0;
          if (endsWithQuestion) { const fromEnd = totalLetters - lettersSoFar; if (fromEnd < 4) bend = (4 - fromEnd) * 1.5; }
          if (soundOn) playLetter(ch.toLowerCase(), pitch, step, bend);
        } else if (/[.,!?;:]/.test(ch)) delay = step * 3;
        if (onChar) onChar();
        setTimeout(tick, delay * 1000);
      }
      tick();
    });
  }
  function sayInVoice(text, pitch) { return typeOut(document.createElement('span'), text, () => pitch); }

  // Messages speak one after another, never on top of each other.
  let speechQueue = Promise.resolve();
  function enqueueSpeech(fn) {
    speechQueue = speechQueue.then(fn).catch(err => console.error(err));
    return speechQueue;
  }
</script>
