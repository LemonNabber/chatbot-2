<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FriendBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Cossette+Texte&family=Noto+Sans+JP&family=Noto+Sans+Symbols+2&display=block" rel="stylesheet">
<style>
  /* ============================================================
     FONTS (see the requirements doc: "Fonts", "Which font where")
     Interface = Cossette Texte · The friend = Balsamiq Sans · Data = OT Bulb Monoline
     OT Bulb Monoline is commercial: put its file at fonts/OTBulbMonoline-Regular.woff2.
     ============================================================ */
  @font-face {
    font-family: 'OT Bulb Monoline';
    src: url('fonts/OTBulbMonoline-Regular.woff2') format('woff2'),
         url('fonts/OTBulbMonoline-Regular.otf') format('opentype');
    font-display: block;
  }

  :root {
    --kaomoji: 'Noto Sans JP', 'Noto Sans Symbols 2', sans-serif;
    --f-ui: 'Cossette Texte', 'Arial Narrow', var(--kaomoji);
    --f-friend: 'Balsamiq Sans', 'Comic Neue', var(--kaomoji);
    --f-data: 'OT Bulb Monoline', ui-monospace, monospace, var(--kaomoji);

    /* type scale ("Type scale and sizing") */
    --text-display: 4.5rem;
    --text-xl: 1.375rem;
    --text-lg: 1.125rem;
    --text-md: 1rem;
    --text-sm: 0.875rem;
    --text-xs: 0.75rem;
    --text-msg: 0.984375rem; /* message rows: 0.875 x text-lg */

    /* colour ("Modes and colour") */
    --ink: #050708;
    --paper: #ffffff;
    --chrome: #f2f2f2;
    --line: #a8a8a8;
    --muted: #9a9a9a;
    --tint: #dfe6e4;
    --sidebar: #0b0b0b;
    --rule: #c8c8c8;     /* hairlines: frames, dividers */
    --key: #ececec;      /* button faces */
    --key-hover: #dddddd;

    /* radii, from outside in */
    --r-window: 0.75rem;
    --r-panel: 0.5rem;
    --r-control: 0.35rem;
    --r-small: 0.25rem;
  }

  /* Root size follows the screen so the window scales as one object. */
  html { font-size: clamp(10px, min(1.2vw, 1.78vh), 22px); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #2d5bd6;
    color: var(--ink);
    font-family: var(--f-ui);
    overflow: hidden;
    height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* type roles */
  .f-ui { font-family: var(--f-ui); letter-spacing: 0.02em; }
  .f-friend { font-family: var(--f-friend); }
  .f-data { font-family: var(--f-data); }

  /* ============================================================
     DESKTOP
     ============================================================ */
  #sky {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    display: block; will-change: transform;
  }
  /* window stacking: whichever window you click gets the next z-index (bringToFront) */
  #desktop { z-index: 40; pointer-events: none; } /* full-screen layer: only the window itself takes clicks */
  #desktop > .window { pointer-events: auto; }
  .datawin { z-index: 41; }
  #desktop {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem 1.5rem 5rem; /* bottom: room for the dock */
  }

  /* ============================================================
     WINDOW
     ============================================================ */
  .window {
    position: relative;
    background: var(--chrome);
    border: 2px solid #000;
    border-radius: var(--r-window);
    overflow: hidden;
    flex: none;
    display: flex; flex-direction: column;
  }
  .window.w-setup { width: 57rem; height: 38rem; }
  .window.w-chat { width: 74rem; height: 47rem; }

  .titlebar {
    height: 2.25rem; flex: none;
    background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1rem;
  }
  .title {
    font-family: var(--f-data);
    font-size: var(--text-md);
    text-transform: uppercase;
    display: flex; gap: 0.5em; white-space: nowrap;
  }
  .title button { text-transform: uppercase; }
  .title button:hover { text-decoration: underline; }
  .eye { width: 1.8rem; height: 1.2rem; color: #fff; display: flex; }
  .eye svg { width: 100%; height: 100%; }

  .window-body {
    flex: 1; min-height: 0;
    display: flex; gap: 0.6rem;
    padding: 1rem;
  }
  .panel {
    position: relative; flex: 1; min-width: 0;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: var(--r-panel);
    overflow: hidden;
  }
  /* The glow is one opaque layer under everything in the panel (a fading transparent
     edge would be cut hard by the pixel filter). */
  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(38% 34% at 30% 34%, rgba(238, 242, 255, 0.95), rgba(238, 242, 255, 0) 70%),
      radial-gradient(34% 32% at 50% 28%, rgba(255, 244, 220, 0.95), rgba(255, 244, 220, 0) 70%),
      radial-gradient(34% 34% at 70% 36%, rgba(255, 236, 239, 0.95), rgba(255, 236, 239, 0) 70%),
      var(--paper);
  }

  /* ============================================================
     SHARED COMPONENTS
     ============================================================ */
  .headline {
    font-family: var(--f-friend); font-weight: 700;
    font-size: var(--text-display); line-height: 1.05; letter-spacing: -0.01em;
    text-align: center;
  }
  .lead {
    font-family: var(--f-friend);
    font-size: var(--text-xl); line-height: 1.35;
    text-align: center;
  }
  .step-title {
    font-family: var(--f-ui); letter-spacing: 0.02em;
    font-size: var(--text-lg); line-height: 1.2;
    text-transform: uppercase; text-align: center; font-weight: 400;
  }
  .btn {
    font-family: var(--f-ui); letter-spacing: 0.02em;
    font-size: var(--text-lg); line-height: 1.2; text-transform: uppercase;
    min-width: 8rem; padding: 0.5rem 1.4rem;
    background: var(--key);
    border: 2px solid var(--line); border-bottom-width: 4px;
    border-radius: var(--r-control);
    position: relative;
  }
  .btn:hover { background: var(--key-hover); }
  .btn:active:not(:disabled) { border-bottom-width: 2px; top: 2px; }
  .btn:disabled { color: var(--muted); cursor: default; background: var(--chrome); border-color: var(--rule); }
  .btn:focus-visible, .rec:focus-visible, .kao:focus-visible, .enter:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
  .actions {
    position: absolute; left: 0; right: 0; bottom: 1.6rem;
    display: flex; justify-content: center; gap: 1rem;
  }

  /* The user card ("The user card") */
  .card {
    display: inline-flex; flex-direction: column;
    font-family: var(--f-ui); letter-spacing: 0.02em;
    font-size: var(--text-sm); line-height: 1.2; text-transform: uppercase;
    border: 1px solid currentColor;
    background: var(--paper); color: var(--ink);
    white-space: nowrap;
  }
  .card-row { display: flex; align-items: center; gap: 0.55rem; padding: 0.15rem 0.45rem; min-width: 0; }
  .card .c-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; }
  .card-row + .card-row { border-top: 1px solid currentColor; justify-content: flex-end; }
  .card-row > span { display: flex; align-items: center; gap: 0.2rem; }
  .card .c-mood { text-transform: none; }
  .card .c-dur { margin-left: auto; }
  .card .c-when { padding-left: 0.55rem; border-left: 1px solid currentColor; }
  .card svg { width: 1em; height: 1em; flex: none; }

  .portrait {
    width: 11.5rem; height: 11.5rem; flex: none;
    border: 2px solid var(--line); border-radius: var(--r-panel);
    background: var(--tint);
    overflow: hidden;
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .portrait.bot-hidden { background: #000; border: 3px solid #000; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 5px #000; }

  .photo-grey { filter: grayscale(1); } /* used when the pixel filter is off (e.g. Safari) */

  /* ============================================================
     SETUP (FRIEND.BEGIN)
     ============================================================ */
  #setup, #chat { position: absolute; inset: 0; }
  .step { position: absolute; inset: 0; padding: 2rem 5rem; }
  .step-welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4rem; padding-bottom: 7rem; }
  .step-welcome .lead { max-width: 30rem; }
  .step-voice, .step-selfie, .step-mood, .step-name { display: flex; flex-direction: column; align-items: center; }
  .step .step-title { margin-top: 1.2rem; }

  .rail {
    position: absolute; right: 1.2rem; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
    padding: 0.6rem 0.35rem;
    background: var(--paper);
    border: 2px solid var(--rule); border-radius: 1.2rem;
    color: #b5b5b5;
  }
  .rail .r-item { width: 1.4rem; height: 1.4rem; display: flex; align-items: center; justify-content: center; }
  .rail .r-item svg { width: 100%; height: 100%; }
  .rail .r-abc { font-family: var(--f-ui); font-size: var(--text-xs); letter-spacing: 0.02em; }
  .rail .r-item.active { color: #000; }

  /* voice */
  .device {
    margin-top: 1.4rem;
    width: 44rem; height: 24.5rem;
    border: 2px solid var(--rule); border-radius: var(--r-control);
    background: var(--paper);
    position: relative;
  }
  .graph {
    position: absolute; left: 1rem; right: 1rem; top: 0.8rem; height: 17.5rem;
    background: var(--tint);
    border: 2px solid #b9bfbd; border-radius: var(--r-small);
    overflow: hidden;
  }
  .graph canvas { position: absolute; left: 0; top: 0; width: 100%; height: 12.5rem; display: block; }
  .ticks {
    position: absolute; left: 0; right: 0; top: 12.5rem; bottom: 0;
    border-top: 1px solid #000;
    font-family: var(--f-ui); font-size: var(--text-xs); letter-spacing: 0.02em;
  }
  .tick { position: absolute; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; transform: translateX(-50%); }
  .tick::before, .tick::after { content: ""; width: 1px; flex: 1; background: #000; }
  .tick span { padding: 0.15rem 0; }
  .device-foot { position: absolute; left: 1rem; right: 1rem; bottom: 1rem; height: 3.4rem; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .meter { grid-column: 1; grid-row: 1; justify-self: start; width: 9rem; display: flex; flex-direction: column; gap: 3px; }
  .meter i { display: block; height: 2px; background: #c4c4c4; width: 100%; transition: width 80ms linear; }
  .meter i.on { background: #555; }
  .pitch-read { grid-column: 1; grid-row: 1; justify-self: start; margin-left: 10.2rem; font-family: var(--f-ui); font-size: var(--text-xs); letter-spacing: 0.02em; text-transform: uppercase; color: #555; }
  .rec {
    grid-column: 2; grid-row: 1;
    width: 3.4rem; height: 2.6rem;
    background: var(--key); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: var(--r-control);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .rec:hover { background: var(--key-hover); }
  .rec:active { border-bottom-width: 2px; top: 2px; }
  .rec i { display: block; width: 1rem; height: 1rem; background: #444; border-radius: 50%; }
  .rec.recording i { border-radius: 0.1rem; }
  .setup-error { font-family: var(--f-ui); font-size: var(--text-sm); letter-spacing: 0.02em; text-transform: uppercase; margin-top: 0.8rem; text-align: center; max-width: 40rem; }

  /* selfie */
  .camera-wrap { position: relative; margin-top: 0.4rem; padding-top: 2.6rem; } /* arrow + shutter sit inside the box, so the pixel filter never clips them */
  .shutter {
    position: absolute; left: 1.4rem; top: 2.05rem; width: 7rem; height: 0.55rem;
    background: #000; border-radius: 0.2rem 0.2rem 0 0;
  }
  .shutter-mark { position: absolute; left: 4.3rem; top: 0.5rem; width: 0; height: 0; border-left: 0.6rem solid transparent; border-right: 0.6rem solid transparent; border-top: 0.6rem solid #000; animation: nudge 1.1s ease-in-out infinite alternate; }
  @keyframes nudge { from { transform: translateY(0); } to { transform: translateY(0.45rem); } }
  @media (prefers-reduced-motion: reduce) { .shutter-mark { animation: none; } }
  .camera {
    width: 34rem; height: 19.5rem;
    border: 2px solid #9a9a9a; border-radius: 0.4rem;
    background: var(--paper);
    position: relative;
  }
  .viewfinder { position: absolute; left: 1.2rem; top: 1.1rem; width: 6rem; height: 2.2rem; border: 2px solid #9a9a9a; border-radius: 0.2rem; }
  .viewfinder::after { content: ""; position: absolute; left: 1.2rem; right: 1.2rem; top: 0; bottom: 0; background: #e2e2e2; border-left: 2px solid #9a9a9a; border-right: 2px solid #9a9a9a; }
  .lens-outer {
    position: absolute; right: 2.5rem; top: 1.6rem;
    width: 16rem; height: 16rem; border-radius: 50%;
    border: 2px solid #9a9a9a; background: #ececec;
    display: flex; align-items: center; justify-content: center;
  }
  .lens-ring { width: 13.8rem; height: 13.8rem; border-radius: 50%; border: 2px solid #9a9a9a; display: flex; align-items: center; justify-content: center; }
  .lens {
    width: 11rem; height: 11rem; border-radius: 50%;
    border: 2px solid #9a9a9a; overflow: hidden; background: #ececec;
    display: flex; align-items: center; justify-content: center;
  }
  .camera-feed { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  .lens.flash { animation: flash 500ms ease-out; }
  @keyframes flash { from { background: #fff; } to { background: #ececec; } }
  .lens { position: relative; }
  .lens .glass { width: 5.2rem; height: 5.2rem; border-radius: 50%; border: 2px solid #9a9a9a; background: var(--tint); position: relative; }
  .lens .glass::after { content: ""; position: absolute; left: 22%; top: 18%; width: 1.3rem; height: 0.8rem; border-radius: 50%; background: var(--paper); transform: rotate(-30deg); }
  .cam-flash { position: absolute; left: 8.4rem; top: 1.1rem; width: 2.2rem; height: 2.2rem; border: 2px solid #9a9a9a; border-radius: 50%; }
  .cam-mark { position: absolute; left: 1.3rem; bottom: 1rem; font-family: var(--f-ui); font-size: var(--text-sm); letter-spacing: 0.12em; text-transform: uppercase; color: #9a9a9a; }

  /* mood */
  .kao-grid {
    margin-top: 1.4rem;
    width: 46rem; height: calc(6 * 2.9rem + 2 * 0.6rem + 4px); /* exactly six rows: no half-cut row */
    padding: 0.6rem;
    border: 2px solid var(--rule); border-radius: var(--r-control);
    background: var(--paper);
    overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 2.9rem;
    align-content: start;
    font-family: var(--f-ui); font-size: var(--text-md); letter-spacing: 0.02em;
  }
  .kao {
    padding: 0 0.3rem; border-radius: var(--r-small);
    white-space: nowrap; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .kao:hover { background: var(--chrome); }
  .kao.selected { background: var(--ink); color: var(--paper); }

  /* name */
  .step-name { justify-content: center; padding-bottom: 6rem; }
  .name-input {
    width: 41rem; height: 2.8rem;
    border: 2px solid #9a9a9a; border-radius: var(--r-control);
    background: var(--paper);
    font-family: var(--f-ui); letter-spacing: 0.02em; font-size: var(--text-lg);
    text-align: center; outline: none;
  }
  .name-input::placeholder { color: var(--ink); text-transform: uppercase; }
  .name-input:focus::placeholder { color: var(--muted); }
  .name-input:focus { border-color: #000; }

  /* status terminal */
  .status {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 28.5rem; padding: 1rem 1.6rem 1.4rem;
    background: #000; color: #fff; border-radius: var(--r-panel);
    z-index: 5;
  }
  .panel:has(#status:not([hidden])) #setup { visibility: hidden; }
  .status .face { width: 3rem; height: 2.4rem; color: #fff; }
  .term {
    font-family: var(--f-data); font-size: var(--text-md); line-height: 1.2;
    white-space: pre-wrap; margin-top: 1rem; min-height: 9.6em;
  }
  .progress { margin-top: 1.6rem; height: 1.4rem; border: 2px solid #fff; border-radius: var(--r-small); padding: 2px; }
  .progress i { display: block; height: 100%; width: 0; background: #fff; border-radius: 1px; transition: width 400ms ease; }
  .status .btn { margin-top: 1rem; }

  /* ============================================================
     CHAT (FRIEND.START / FRIEND.VISIBLE / ARCHIVE)
     ============================================================ */
  .chat-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .chat-empty .headline { max-width: 26rem; margin-bottom: 4rem; }
  .start-input {
    position: absolute; left: 1.3rem; right: 0.8rem; bottom: 1.1rem;
    border: none; border-bottom: 1px solid #000;
    background: transparent; outline: none;
    font-family: var(--f-ui); letter-spacing: 0.02em; font-size: var(--text-lg);
    padding: 0.2rem 0;
  }
  .start-input::placeholder { color: var(--ink); text-transform: uppercase; }
  .start-input:focus::placeholder { color: var(--muted); }

  .chat-main { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 0.8rem 0.8rem 0.8rem; }
  .chat-head {
    flex: none; height: 19.5rem;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
    padding-top: 7rem;
  }
  .chat-head .portrait { justify-self: center; }
  .head-card { justify-self: center; }
  .visible .chat-head { padding-top: 2.4rem; height: 14.8rem; }

  .list-frame {
    flex: 0 1 auto; min-height: 0; margin-top: auto; /* hug the messages; grow up to the space available */
    border: 2px solid var(--rule); border-bottom: none; border-radius: var(--r-control) var(--r-control) 0 0;
    background: var(--paper);
    padding: 0.5rem 0 0.5rem 0.5rem;
    display: flex;
  }
  .list {
    flex: 1; overflow-y: scroll;
    display: flex; flex-direction: column; gap: 0.4375rem;
    padding-right: 0.5rem;
    scrollbar-width: thin; scrollbar-color: var(--line) var(--chrome);
  }
  .list > :first-child { margin-top: auto; } /* messages sit at the bottom, newest last */
  .list::-webkit-scrollbar { width: 0.8rem; }
  .list::-webkit-scrollbar-track { background: var(--chrome); border: 1px solid #c8c8c8; }
  .list::-webkit-scrollbar-thumb {
    border: 1px solid var(--line);
    background: repeating-linear-gradient(to bottom, #fff 0 2px, var(--line) 2px 3px);
  }

  .row {
    flex: none;
    display: flex; align-items: baseline; gap: 1.75rem;
    min-height: 2.1875rem; padding: 0.4375rem 0.9625rem;
    border: 2px solid var(--line); border-radius: var(--r-small);
    background: var(--paper); color: var(--ink);
  }
  .row.bot { background: var(--ink); border-color: var(--ink); color: #fff; }
  .row-label {
    flex: none; font-family: var(--f-ui); letter-spacing: 0.02em;
    font-size: var(--text-msg); line-height: 1.2; text-transform: uppercase;
  }
  .row-msg { flex: 1; text-align: right; font-size: var(--text-msg); line-height: 1.35; overflow-wrap: anywhere; }
  .slide-in { animation: slide-in 420ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes slide-in { from { opacity: 0; transform: translateY(1.2rem); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .slide-in { animation: none; } }
  .row.context { background: transparent; border: 1px dashed var(--rule); color: var(--muted); }

  .visible .src-group .row.bot { cursor: pointer; }
    /* Closed, the frame is still there but invisible (and pulled out 1px so the row lines up
     with the other rows); opening animates it in (see openSource). */
  .src-group { flex: none; border: 1px solid transparent; border-radius: var(--r-control); margin: -1px; display: flex; flex-direction: column; gap: 0.4375rem; }
  .src-group.open { border-color: var(--rule); padding: 0.4375rem; background: var(--chrome); }
  .src-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .enter {
    font-family: var(--f-ui); letter-spacing: 0.02em; font-size: var(--text-sm); text-transform: uppercase;
    border: 1px solid currentColor; border-radius: var(--r-small); padding: 0.15rem 0.5rem; background: var(--paper);
    flex: none;
  }
  .enter:hover { background: var(--key); }

  /* the input closes the bottom of the list frame, like the edit line of a terminal */
  .msg-input {
    flex: none; height: 3rem; width: 100%;
    border: 2px solid var(--rule); border-radius: 0 0 var(--r-control) var(--r-control);
    outline: none; background: var(--paper);
    font-family: var(--f-ui); letter-spacing: 0.02em; font-size: var(--text-lg);
    padding: 0 0.9rem;
  }
  .msg-input::placeholder { color: var(--muted); text-transform: uppercase; }
  .msg-input:focus { border-top-color: var(--line); }
  .msg-input:disabled { color: transparent; }
  .msg-input:disabled::placeholder { color: transparent; }

  /* visible sidebar */
  .sidebar {
    width: 18rem; flex: none;
    background: var(--sidebar);
    border: 2px solid #2a2a2a; border-radius: var(--r-panel);
    padding: 0.8rem 0.7rem;
    display: flex; flex-direction: column; gap: 0.6rem;
    color: #fff;
  }
  .people { display: flex; align-items: center; gap: 0.35rem; color: #6d6d6d; min-height: 1.5rem; }
  .people button { width: 1.5rem; height: 1.5rem; display: flex; }
  .people button.sel { color: #fff; }
  .people svg { width: 100%; height: 100%; }
  .people .count { margin-left: auto; font-family: var(--f-ui); font-size: var(--text-sm); color: #fff; }
  .side-card .card { background: var(--sidebar); color: #fff; width: 100%; }
  .visible .window-body { gap: 0; }
  /* Cartridge stack: two columns, rows overlap like cards in a box. Row 0 (bottom) is in
     front and lightest; each row up sits further back and darker. Sizes come from the
     stack's own box (container units), so the stack always fits. */
  .slots { flex: 1; min-height: 0; position: relative; container-type: size; margin-top: 0.6rem; }
  .slot {
    --gap: 0.6rem;
    --W: min(calc((100cqw - var(--gap)) / 2), calc(100cqh / 2.45 * 0.837));
    --H: calc(var(--W) / 0.837);
    --step: calc(var(--H) * 0.58);
    position: absolute; width: var(--W); height: var(--H);
    bottom: calc(var(--row) * var(--step));
    left: calc(50cqw - var(--W) - var(--gap) / 2 + var(--col) * (var(--W) + var(--gap)));
  }
  /* Rows with no cartridge yet ("future" rows) sit ABOVE the stack without overlapping it
     or each other. They shrink if needed so everything fits. JS sets --nf (rows in the
     stack), --has (1 if there is a stack), --k (future rows) and --e (which future row). */
  .slot.future {
    --top: calc(var(--has) * ((var(--nf) - 1) * var(--step) + var(--H)));
    --he: min(var(--H), calc((100cqh - var(--top) - var(--k) * var(--gap)) / var(--k)));
    --we: calc(var(--he) * 0.837);
    width: var(--we); height: var(--he);
    bottom: calc(var(--top) + var(--gap) * var(--has) + var(--e) * (var(--he) + var(--gap)));
    left: calc(50cqw - var(--W) - var(--gap) / 2 + var(--col) * (var(--W) + var(--gap)) + (var(--W) - var(--we)) / 2);
  }
  .cart { position: relative; width: 100%; height: 100%; transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1); }
  .cart > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  /* The cartridge art (assets/id card.svg) includes its own drop shadow, so the image is
     bigger than the shell: these offsets line the shell up with the .cart box. */
  .cart-art {
    position: absolute; left: -12.21%; top: -5.44%; width: 125%; height: 124.55%;
    max-width: none; display: block; pointer-events: none; user-select: none;
  }
  /* rows further back are darker */
  .slot[data-row="1"] .cart-art { filter: brightness(0.62); }
  .slot[data-row="2"] .cart-art { filter: brightness(0.42); }
  .slot[data-row="1"] .label { opacity: 0.75; }
  .slot[data-row="2"] .label { opacity: 0.6; }
  .slot.sel .label { opacity: 1; }
  .slot.filled .cart { cursor: pointer; }
  .slot.filled:hover .cart { transform: translateY(-0.3rem); }
  /* selected: pops up and comes to the front, so nothing covers it */
  .slot.sel { z-index: 20 !important; }
  .slot.sel .cart, .slot.sel:hover .cart { transform: translateY(calc(var(--H) * -0.3)) scale(1.04); }
  .slot.sel .cart-art, .slot.sel[data-row] .cart-art { filter: brightness(1.12) contrast(1.05) drop-shadow(0 0.4rem 0.6rem rgba(0, 0, 0, 0.6)); }
  /* the photo shows on the selected cartridge's label, multiplied onto the sage glass */
  .cart .label {
    position: absolute; left: 4.6%; top: 4.9%; width: 90.3%; height: 71.7%;
    clip-path: polygon(0 0, 80% 0, 100% 20%, 100% 100%, 0 100%);
    border-radius: 0.3rem;
    mix-blend-mode: multiply;
  }
  .cart .label img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ARCHIVE: the colour flip */
  .archive .panel { background: #000; border-color: #5a5a5a; color: #fff; }
  .archive .glow {
    background:
      radial-gradient(38% 34% at 30% 34%, rgba(70, 70, 70, 0.8), rgba(70, 70, 70, 0) 70%),
      radial-gradient(34% 32% at 50% 28%, rgba(90, 90, 90, 0.8), rgba(90, 90, 90, 0) 70%),
      radial-gradient(34% 34% at 70% 36%, rgba(60, 60, 60, 0.8), rgba(60, 60, 60, 0) 70%),
      #000;
  }
  .archive .list-frame { background: #000; border-color: #5a5a5a; }
  .archive .msg-input { background: #000; border-color: #5a5a5a; }
  .archive .row.bot { border-color: #fff; }
  .archive .row.context { border-color: #5a5a5a; }
  .archive .head-card .card { background: #000; color: #fff; }
  .archive .src-head .card { background: #111; color: #fff; }
  .archive .enter { background: #000; }
  .archive .enter:hover { background: #222; }
  .archive .src-group.open { border-color: #5a5a5a; background: #111; }
  .archive .row.context { color: #8a8a8a; }
  .archive .msg-input { color: #fff; }
  .archive .msg-input:disabled { color: transparent; }
  .archive .list { scrollbar-color: #5a5a5a #000; }
  .archive .list::-webkit-scrollbar-track { background: #000; border-color: #5a5a5a; }

  /* ============================================================
     DOCK
     ============================================================ */
  .dock, .pixel-toggle { z-index: 100000; }
  /* TEMPORARY (testing): skip the voice / photo steps. Same look as the pixel toggle, just above it. */
  .pixel-toggle.skip-btn { bottom: 3.4rem; }
  .dock {
    position: fixed; left: 50%; bottom: 0.6rem; transform: translateX(-50%);
    display: flex; gap: 0.8rem; align-items: flex-end;
  }
  .dock button { width: 3.4rem; height: 2.8rem; display: flex; }
  .dock svg { width: 100%; height: 100%; }

  /* ============================================================
     DATA WINDOW (movable). All OT Bulb, all text and lines.
     ============================================================ */
  .datawin {
    position: fixed; left: 0; top: 0;
    width: 50rem; height: 36rem; /* always the same size; the contents scroll */
    max-width: calc(100vw - 2rem); max-height: calc(100vh - 2rem);
    display: flex; flex-direction: column;
    font-family: var(--f-data); font-size: var(--text-sm); line-height: 1.5;
    box-shadow: 0 0.8rem 2rem rgba(0, 0, 0, 0.35);
    border-radius: 0.6rem;
  }
  .dw-tab {
    flex: none; display: flex; justify-content: space-between; align-items: center;
    background: #fff; color: #000; border: 2px solid #000; border-bottom: none;
    border-radius: 0.6rem 0.6rem 0 0; padding: 0.3rem 0.9rem;
    font-size: var(--text-md); cursor: grab; user-select: none; touch-action: none;
  }
  .dw-tab:active { cursor: grabbing; }
  .dw-close { font-family: var(--f-data); font-size: var(--text-sm); }
  .dw-close:hover { text-decoration: underline; }
  .dw-body {
    flex: 1; min-height: 0; overflow: auto;
    background: #000; color: #fff; border: 2px solid #000; border-radius: 0 0 0.6rem 0.6rem;
    padding: 1rem 1.2rem 1.4rem;
    scrollbar-width: thin; scrollbar-color: #5a5a5a #000;
  }
  .dw-dim { color: #8a8a8a; }
  .dw-path { font-size: var(--text-md); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .dw-rule { border-top: 1px dashed #8a8a8a; margin: 0.5rem 0 1rem; }
  .dw-conv { border: 1px solid #fff; }
  .dw-head { display: block; width: fit-content; border-right: 1px solid #fff; border-bottom: 1px solid #fff; padding: 0 0.5rem; white-space: pre; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .dw-lines { padding: 0.1rem 0.5rem 0.3rem; }
  .dw-line { display: grid; grid-template-columns: 4ch 5ch 5ch 6ch minmax(0, 1fr) 6ch; white-space: pre; }
  .dw-line .c { overflow: hidden; text-overflow: ellipsis; }
  .dw-line .r { text-align: right; }
  .dw-line.pick { cursor: pointer; }
  .dw-line.pick:hover .c { text-decoration: underline; }
  .dw-line.sel { background: #fff; color: #000; }
  .dw-match { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .dw-snap { margin-left: 0.5ch; border-left: 1px solid #fff; padding: 0 0 0.2rem 7ch; }
  .dw-gap { margin: 1.4rem 0.5rem; white-space: pre; }
  .dw-note { color: #8a8a8a; white-space: pre-wrap; }

  /* ============================================================
     MAP WINDOW (movable): conversations as a timeline, newest at the top
     ============================================================ */
  .mapwin { width: 40rem; height: 44rem; }
  .mw-frame { position: relative; flex: 1; min-height: 0; border: 2px solid #000; border-radius: 0 0 0.6rem 0.6rem; overflow: hidden; background: #000; }
  .mw-body { position: absolute; inset: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: #5a5a5a #000; }
  .mw-map {
    position: relative; min-height: 100%;
    /* dotted screen, fading to black further back in time */
    background:
      linear-gradient(to bottom, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0.55) 55%, #000 100%),
      radial-gradient(circle, rgba(255, 255, 255, 0.2) 0.9px, transparent 1.2px) 0 0 / 5px 5px,
      #1d1d1d;
    color: #fff; font-family: var(--f-data);
  }
  .mw-axis { position: absolute; left: 3.2rem; top: 0; bottom: 0; border-left: 2px solid #bdbdbd; }
  .mw-grid { position: absolute; left: 0.4rem; right: 0; border-top: 1px dashed #cfcfcf; }
.mw-date { position: absolute; left: 0.7rem; transform: translateY(-1.55em); font-size: var(--text-xs); color: #e6e6e6; white-space: pre; line-height: 1.5; }
  .mw-time { position: absolute; left: 0.45rem; transform: translateY(-50%); font-size: var(--text-xs); color: #cfcfcf; white-space: pre; }
  .mw-tick { position: absolute; left: 3.2rem; width: 0.6rem; border-top: 2px solid #bdbdbd; }
  .mw-edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .mw-node { position: absolute; --s: 2.4rem; }
  .mw-node .sq { position: relative; width: var(--s); height: var(--s); background: #8a8a8a; }
  .mw-node .sq img { width: 100%; height: 100%; display: block; }
  .mw-node.opened .sq { background: #fff; box-shadow: 0 0 0 0.35rem #9c9c9c; }
  .mw-node.current { --s: 3.8rem; }
  .mw-node.current .sq { box-shadow: 0 0 0 0.55rem #9c9c9c; }
  .mw-node .brackets { position: absolute; inset: 0.3rem; pointer-events: none; }
  .mw-label {
    position: absolute; left: 0; top: calc(var(--s) + 0.1rem); white-space: pre;
    background: #e6e6e6; color: #000; font-size: var(--text-xs); padding: 0 0.35rem; line-height: 1.5;
  }
  .mw-node.opened .mw-label { top: calc(var(--s) + 0.4rem); left: 0.1rem; }
  .mw-node.current .mw-label { top: auto; bottom: calc(var(--s) + 0.7rem); left: -0.3rem; }
  .mw-pips { position: absolute; left: 0; top: calc(var(--s) + 1.45rem); display: flex; gap: 0.2rem; }
  .mw-pips i { width: 0.7rem; height: 0.7rem; background: #ddd; display: block; }
  .mw-pips span { font-size: var(--text-xs); color: #ddd; margin-left: 0.15rem; line-height: 0.7rem; }
  /* the radiating stroke: each node in the chain pings in turn */
  .mw-node .ring { position: absolute; inset: -0.6rem; border: 2px solid #fff; opacity: 0; pointer-events: none; }
  .mw-node.ping .ring { animation: mw-ring 1.1s ease-out; }
  @keyframes mw-ring { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .mw-node.ping .ring { animation: none; opacity: 1; } }
  .mw-info {
    position: absolute; top: 0.6rem; right: 0.6rem; width: 12rem; z-index: 2;
    background: #000; color: #fff; border: 2px solid #fff;
    font-family: var(--f-data); font-size: var(--text-xs); line-height: 1.35;
    padding: 0.3rem 0.5rem; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .mw-empty { padding: 2rem; color: #8a8a8a; font-family: var(--f-data); }

  /* pixel effect on/off, bottom right */
  .pixel-toggle {
    position: fixed; right: 1rem; bottom: 1rem;
    font-family: var(--f-ui); letter-spacing: 0.02em; font-size: var(--text-xs); text-transform: uppercase;
    padding: 0.3rem 0.6rem;
    background: var(--chrome); border: 2px solid #000; border-bottom-width: 3px; border-radius: var(--r-control);
  }
  .pixel-toggle:hover { background: var(--key-hover); }
</style>
</head>
<body>

<canvas id="sky" class="px-img" data-px-width="1" aria-hidden="true"></canvas>

<main id="desktop">
  <section id="window" class="window w-setup">
    <header class="titlebar px">
      <div id="title" class="title"></div>
      <button id="eye" class="eye" hidden aria-label="Show where the bot's words come from"></button>
    </header>

    <div class="window-body">
      <!-- visible-mode sidebar -->
      <aside id="sidebar" class="sidebar" hidden>
        <div id="people" class="people px" data-px-extra="#6d6d6d #fff"></div>
        <div id="side-card" class="side-card"></div>
        <div id="slots" class="slots"></div>
      </aside>

      <div id="panel" class="panel">
        <div class="glow px-img" data-px-levels="24" data-px-width="1"></div>

        <!-- ================= SETUP ================= -->
        <div id="setup">
          <section class="step step-welcome" data-step="welcome">
            <h1 class="headline px">Welcome</h1>
            <p class="lead px">Welcome to the FriendBot Setup Assistant! Based on your answers to a few brief questions, this assistant sets up your account so you can speak with your newest friendliest friend.</p>
            <div class="actions"><button id="initiate-btn" class="btn px" data-px-extra="#ddd">Initiate</button></div>
          </section>

          <section class="step step-voice" data-step="voice" hidden>
            <h2 class="step-title px">Say “hello”</h2>
            <div class="device">
              <div class="graph px">
                <canvas id="graph"></canvas>
                <div class="ticks">
                  <div class="tick" style="left:4%"><span>0.0S</span></div>
                  <div class="tick" style="left:50%"><span>1.5S</span></div>
                  <div class="tick" style="left:96%"><span>3.0S</span></div>
                </div>
              </div>
              <div class="device-foot">
                <div class="meter" id="meter"><i></i><i></i><i></i></div>
                <div class="pitch-read px" id="pitch-read"></div>
                <button id="rec-btn" class="rec px" aria-label="Record"><i></i></button>
              </div>
            </div>
            <p id="voice-error" class="setup-error px" hidden></p>
            <div class="actions"><button id="voice-continue" class="btn px" data-px-extra="#ddd" hidden>Continue</button></div>
          </section>

          <section class="step step-selfie" data-step="selfie" hidden>
            <h2 class="step-title px">Snap a selfie</h2>
            <div class="camera-wrap px">
              <div class="shutter-mark"></div>
              <button id="shutter" class="shutter" aria-label="Take photo"></button>
              <div class="camera">
                <div class="viewfinder"></div>
                <div class="cam-flash"></div>
                <div class="cam-mark">FriendBot</div>
                <div class="lens-outer"><div class="lens-ring"><div class="lens" id="lens">
                  <div class="glass"></div>
                </div></div></div>
              </div>
            </div>
            <!-- The camera feed is never shown, so nobody fusses over how they look.
                 It still has to play (invisibly) so the shutter can grab a frame. -->
            <video id="camera-video" class="camera-feed" playsinline muted aria-hidden="true"></video>
            <canvas id="photo-canvas" hidden></canvas>
            <p id="camera-error" class="setup-error px" hidden></p>
            <div class="actions">
              <button id="retake-btn" class="btn px" data-px-extra="#ddd" hidden>Retake</button>
              <button id="selfie-continue" class="btn px" data-px-extra="#ddd" hidden>Continue</button>
            </div>
          </section>

          <section class="step step-mood" data-step="mood" hidden>
            <h2 class="step-title px">How do you feel?</h2>
            <div id="kao-grid" class="kao-grid px" data-px-extra="#ddd #f2f2f2" role="listbox" aria-label="Pick a face"></div>
            <div class="actions"><button id="mood-continue" class="btn px" data-px-extra="#ddd" disabled>Continue</button></div>
          </section>

          <section class="step step-name" data-step="name" hidden>
            <input id="name-input" class="name-input px" data-px-extra="#000 #9a9a9a" placeholder="Your name" maxlength="50" autocomplete="off">
            <div class="actions"><button id="name-continue" class="btn px" data-px-extra="#ddd" disabled>Continue</button></div>
          </section>

          <nav class="rail px" id="rail" aria-label="Setup steps">
            <span class="r-item" data-for="voice"></span>
            <span class="r-item" data-for="selfie"></span>
            <span class="r-item" data-for="mood"></span>
            <span class="r-item r-abc" data-for="name">ABC</span>
          </nav>
        </div>

        <!-- ================= CHAT ================= -->
        <div id="chat" hidden>
          <div id="chat-empty" class="chat-empty">
            <h1 class="headline px">What’s on your mind?</h1>
            <input id="start-input" class="start-input px" data-px-extra="#9a9a9a" placeholder="Start the conversation" maxlength="500" autocomplete="off">
          </div>
          <div id="chat-main" class="chat-main" hidden>
            <div class="chat-head">
              <div id="face-left" class="portrait left"></div>
              <div id="head-card" class="head-card"></div>
              <div id="face-right" class="portrait right"></div>
            </div>
            <div class="list-frame">
              <div id="list-own" class="list"></div>
              <div id="list-archive" class="list" hidden></div>
            </div>
            <input id="message-input" class="msg-input px" data-px-extra="#9a9a9a" placeholder="Type a message" maxlength="500" autocomplete="off" aria-label="Message">
          </div>
        </div>

        <!-- status terminal -->
        <div id="status" class="status px" hidden>
          <div class="face" id="status-face"></div>
          <div id="term" class="term"></div>
          <div class="progress"><i id="progress"></i></div>
          <button id="retry-btn" class="btn px" data-px-extra="#ddd" hidden>Try again</button>
        </div>
      </div>
    </div>
  </section>
</main>

<nav id="dock" class="dock" aria-label="Dock"></nav>

<!-- DATA window: the conversations you have tracked through, as raw data (folder icon) -->
<section id="datawin" class="datawin" hidden aria-label="Data">
  <header id="dw-tab" class="dw-tab"><span>DATA</span><button id="dw-close" class="dw-close" aria-label="Close the data window">[X]</button></header>
  <div id="dw-body" class="dw-body"></div>
</section>

<!-- MAP window: every conversation used by the ones you opened, as a timeline (floppy icon) -->
<section id="mapwin" class="datawin mapwin" hidden aria-label="Map">
  <header id="mw-tab" class="dw-tab"><span>MAP</span><button id="mw-close" class="dw-close" aria-label="Close the map">[X]</button></header>
  <div class="mw-frame"><div id="mw-body" class="mw-body"></div><div id="mw-info" class="mw-info" hidden></div></div>
</section>
<button id="pixel-toggle" class="pixel-toggle" hidden></button>
<button id="skip-btn" class="pixel-toggle skip-btn" hidden>Skip</button> <!-- TEMPORARY: testing only -->

  // ============================================================
  // DESKTOP: sky wallpaper (drawn, so the page needs no image file)
  // ============================================================
  function drawSky() {
    const c = $('sky');
    const w = Math.max(1, Math.round(innerWidth)), h = Math.max(1, Math.round(innerHeight));
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#2a52cf'); g.addColorStop(0.55, '#4f7fdc'); g.addColorStop(1, '#a9c3ea');
    x.fillStyle = g; x.fillRect(0, 0, w, h);

    // fractal value noise -> soft clouds, denser towards the bottom
    const S = 4, gw = Math.ceil(w / S), gh = Math.ceil(h / S);
    const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
    const lat = n => { const a = new Float32Array((n + 2) * (n + 2)); for (let i = 0; i < a.length; i++) a[i] = rand(); return a; };
    const octaves = [6, 12, 24, 48].map(n => ({ n, a: lat(n) }));
    const noise = (u, v, o) => {
      const n = o.n, X = u * n, Y = v * n, i = Math.floor(X), j = Math.floor(Y), fx = X - i, fy = Y - j;
      const at = (p, q) => o.a[(q % (n + 2)) * (n + 2) + (p % (n + 2))];
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const top = at(i, j) * (1 - sx) + at(i + 1, j) * sx, bot = at(i, j + 1) * (1 - sx) + at(i + 1, j + 1) * sx;
      return top * (1 - sy) + bot * sy;
    };
    const img = x.getImageData(0, 0, w, h), d = img.data;
    for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
      const u = gx / gw, v = gy / gh;
      let f = 0, amp = 0.5;
      for (const o of octaves) { f += noise(u * 1.6, v, o) * amp; amp *= 0.5; }
      const cover = f + (v - 0.55) * 0.55 - 0.42;
      const a = Math.max(0, Math.min(1, cover * 3.2)) * 0.85;
      if (a <= 0) continue;
      for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++) {
        const px = gx * S + xx, py = gy * S + yy;
        if (px >= w || py >= h) continue;
        const k = (py * w + px) * 4;
        d[k] += (244 - d[k]) * a; d[k + 1] += (247 - d[k + 1]) * a; d[k + 2] += (252 - d[k + 2]) * a;
      }
    }
    x.putImageData(img, 0, 0);
  }

    const min = Math.floor(Math.max(0, ms || 0) / 60000);

    if (min < 60) return min + ' MIN';
    return Math.floor(min / 60) + ' HR ' + (min % 60) + ' MIN';
  }

    const bottom = el('div', 'card-row', info.startedAt ? fmtStarted(info.startedAt) : '');

      });

  // ---------- voice ----------
  const graph = $('graph');
  let recording = false;

  function sizeGraph() {
    const r = graph.getBoundingClientRect();
    graph.width = Math.max(1, Math.round(r.width * devicePixelRatio));
    graph.height = Math.max(1, Math.round(r.height * devicePixelRatio));
  }

  // pitch (Hz) -> height in the graph (log scale, 70-500 Hz)
  const pitchY = (hz, h) => h * (0.85 - 0.7 * (Math.log(hz / 70) / Math.log(500 / 70)));

  // Strokes a smooth curve through points (sorted by x) with cubic beziers.
  // Monotone tangents (Fritsch-Carlson): the curve never overshoots a point,
  // so a flat stretch stays flat and peaks stay where the voice actually was.
  function smoothCurve(c, pts) {
    const n = pts.length;
    const d = [], m = [];
    for (let i = 0; i < n - 1; i++) d.push((pts[i + 1][1] - pts[i][1]) / ((pts[i + 1][0] - pts[i][0]) || 1));
    for (let i = 0; i < n; i++) {
      if (i === 0) m.push(d[0] || 0);
      else if (i === n - 1) m.push(d[n - 2]);
      else m.push(d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2);
    }
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], r = a * a + b * b;
      if (r > 9) { const t = 3 / Math.sqrt(r); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
    }
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < n - 1; i++) {
      const dx = (pts[i + 1][0] - pts[i][0]) / 3;
      c.bezierCurveTo(pts[i][0] + dx, pts[i][1] + m[i] * dx, pts[i + 1][0] - dx, pts[i + 1][1] - m[i + 1] * dx, pts[i + 1][0], pts[i + 1][1]);
    }
    c.stroke();
  }

  function drawGraph(wave, segments, progress) {
    sizeGraph();
    const c = graph.getContext('2d'), w = graph.width, h = graph.height, k = devicePixelRatio;
    const x0 = w * 0.04, x1 = w * 0.96, xp = x0 + (x1 - x0) * progress;
    c.clearRect(0, 0, w, h);
    c.strokeStyle = '#000'; c.fillStyle = '#000';
    c.lineWidth = 1 * k;
    c.beginPath(); c.moveTo(x0, h * 0.13); c.lineTo(x0, h); c.moveTo(x1, h * 0.13); c.lineTo(x1, h);
    c.moveTo(x0, h * 0.5); c.lineTo(x1, h * 0.5); c.stroke();
    const tx = t => x0 + (x1 - x0) * (t / RECORD_SECONDS);
    c.lineCap = 'round'; c.lineJoin = 'round';
    // waveform: a smooth line through the midpoints between samples
    if (wave.length > 1) {
      const pts = wave.map((v, i) => [x0 + (x1 - x0) * (i / (RECORD_SECONDS * 60)), h * 0.5 - v * h * 0.42]);
      c.lineWidth = 1.2 * k;
      c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) {
        c.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
      }
      c.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      c.stroke();
    }
    // detected pitch: one thick bezier curve per stretch of voice (silence breaks it)
    c.lineWidth = 5 * k;
    let run = [];
    const flush = () => {
      if (!run.length) return;
      const pts = [[tx(run[0].t0), pitchY(run[0].hz, h)]];
      run.forEach(s => pts.push([tx((s.t0 + s.t1) / 2), pitchY(s.hz, h)]));
      pts.push([tx(run[run.length - 1].t1), pitchY(run[run.length - 1].hz, h)]);
      smoothCurve(c, pts);
      run = [];
    };
    segments.forEach(s => { if (s.hz) run.push(s); else flush(); });
    flush();
    // playhead
    if (progress > 0) {
      c.lineWidth = 1 * k;
      c.beginPath(); c.moveTo(xp, h * 0.1); c.lineTo(xp, h); c.stroke();
      c.beginPath(); c.moveTo(xp - 6 * k, h * 0.06); c.lineTo(xp + 6 * k, h * 0.06); c.lineTo(xp, h * 0.06 + 7 * k); c.fill();
    }
  }

  function showVoiceError(msg) {
    $('voice-error').textContent = msg;
    $('voice-error').hidden = false;
  }

  $('rec-btn').addEventListener('click', () => {
    if (recording) { recording = false; return; } // stop early
    recordVoice();
  });

  async function recordVoice() {
    $('voice-error').hidden = true;
    $('voice-continue').hidden = true;
    $('pitch-read').textContent = '';
    const ctx = getAudioCtx();

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      console.error(err);
      showVoiceError("Couldn't use the microphone. A voice is required to continue. Allow microphone access and try again.");
      return;
    }

    recording = true;
    $('rec-btn').classList.add('recording');
    $('rec-btn').setAttribute('aria-label', 'Stop');

    const chunks = [];
    const recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    const stopped = new Promise(r => { recorder.onstop = r; });

    // live drawing
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
    src.connect(analyser);
    const buf = new Float32Array(analyser.fftSize);
    const wave = [], segments = [], frames = [];
    let smooth = 0, segStart = 0;
    const meter = [...document.querySelectorAll('#meter i')];
    const t0 = performance.now();

    recorder.start();
    await new Promise(resolve => {
      function frame() {
        const t = (performance.now() - t0) / 1000;
        analyser.getFloatTimeDomainData(buf);
        let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const rms = Math.sqrt(sum / buf.length);
        smooth = smooth * 0.55 + (buf[0] * 4) * 0.45;
        wave.push(Math.max(-1, Math.min(1, smooth)));
        meter.forEach((m, i) => { m.classList.toggle('on', rms * 12 > i / 3); m.style.width = (40 + Math.min(60, rms * 600)) + '%'; });
        if (rms > 0.01) { const p = framePitch(buf, 0, buf.length, ctx.sampleRate); if (p) frames.push(p); }
        if (t - segStart >= 0.25 || t >= RECORD_SECONDS || !recording) {
          frames.sort((a, b) => a - b);
          segments.push({ t0: segStart, t1: Math.min(t, RECORD_SECONDS), hz: frames.length >= 2 ? frames[frames.length >> 1] : null });
          frames.length = 0; segStart = t;
        }
        drawGraph(wave, segments, Math.min(1, t / RECORD_SECONDS));
        if (t < RECORD_SECONDS && recording) requestAnimationFrame(frame); else resolve();
      }
      requestAnimationFrame(frame);
    });
    recording = false;
    recorder.stop();
    await stopped;
    stream.getTracks().forEach(t => t.stop());
    src.disconnect();
    meter.forEach(m => { m.classList.remove('on'); m.style.width = ''; });
    $('rec-btn').classList.remove('recording');
    $('rec-btn').setAttribute('aria-label', 'Record again');

    let audio;
    try {
      const blob = new Blob(chunks, { type: recorder.mimeType });
      audio = await ctx.decodeAudioData(await blob.arrayBuffer());
    } catch (err) {
      console.error(err);
      showVoiceError('Something went wrong reading the recording. Please try again.');
      return;
    }
    // The recording only ever exists in this function. It is never uploaded.

    const result = detectPitch(audio.getChannelData(0), audio.sampleRate);
    if (!result.pitch) {
      showVoiceError({
        quiet: 'That was too quiet. Try again a little louder, or closer to the microphone.',
        unclear: "Couldn't hear a clear voice. Try again and hold the \"hel-\": \"hellooo\"."
      }[result.reason] || 'Please try again.');
      return;
    }
    state.voicePitch = result.pitch;
    $('pitch-read').textContent = Math.round(result.pitch) + ' HZ';
    $('voice-continue').hidden = false;
    sayInVoice('hello!', state.voicePitch);
  }
  $('voice-continue').addEventListener('click', () => showStep('selfie'));

  // ---------- selfie ----------
  let cameraStream = null;
  async function startCamera() {
    if (cameraStream || state.photoBlob) return;

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      // moved on (e.g. skipped) while the camera was starting: switch it straight off

      cameraStream = stream;

  // ---------- mood ----------
  const KAOMOJI = [

  // ---------- status terminal + saving ----------
  $('status-face').innerHTML = ICON.face;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function termType(line) {
    const t = $('term');

    t.textContent += '\n';
  }

  let saving = false;
  async function finishSetup() {
    const name = $('name-input').value.trim();
    if (saving || !name || !state.photoBlob || !state.voicePitch || !state.mood) return;
    saving = true;
    state.name = name;
    $('name-continue').disabled = true;
    $('status').hidden = false;
    $('retry-btn').hidden = true;
    $('term').textContent = '';
    $('progress').style.width = '0%';

    for (const line of ['[STATUS]', 'Voice: Success', 'Photo: Success', 'Mood: Success', 'Name: Success', 'PROFILE CREATED', '', 'Uploading to cloud...', 'Do not close window']) await termType(line);

    const id = crypto.randomUUID();
    const photoPath = id + '.jpg';
    $('progress').style.width = '25%';
    const { error: upErr } = await supabaseClient.storage.from('conversation-photos')
      .upload(photoPath, state.photoBlob, { contentType: 'image/jpeg' });
    if (upErr) return setupFailed(upErr);
    $('progress').style.width = '60%';

    const { error } = await supabaseClient.from('conversations').insert({
      id, display_name: name, photo_path: photoPath, mood: state.mood,
      voice_pitch: Math.round(state.voicePitch * 10) / 10
    });
    if (error) return setupFailed(error);
    $('progress').style.width = '100%';

    state.conversationId = id;

    getCard(id).then(c => { if (c) { state.number = c.number; renderHeader(); } });

  }
  function setupFailed(err) {

  $('retry-btn').addEventListener('click', () => { $('status').hidden = true; showStep('name'); });

  // ============================================================
  // CHAT
  // ============================================================
  function enterChat() {
    $('status').hidden = true;
    $('setup').hidden = true;
    $('chat').hidden = false;
    win.classList.replace('w-setup', 'w-chat');
    $('eye').hidden = false;
    renderChrome();
    setTimeout(() => $('start-input').focus(), 50);
    setInterval(() => { if (!inArchive()) renderHeader(); }, 30000); // keep the duration current
  }

  const inArchive = () => state.path.length > 0;
  const isVisible = () => state.mode === 'visible' || inArchive();

  // Title, eye, dock, sidebar, header: everything that depends on mode / archive level.
  function renderChrome() {
    win.classList.toggle('visible', isVisible());
    win.classList.toggle('archive', inArchive());
    $('eye').innerHTML = isVisible() ? ICON.eyeOpen : ICON.eyeClosed;
    $('eye').setAttribute('aria-label', isVisible() ? "Hide where the bot's words come from" : "Show where the bot's words come from");

    if (inArchive()) {
      const parts = [{ text: 'FRIEND.VISIBLE_ARCHIVE' }, { text: state.name, onClick: () => leaveArchive(0) }];
      state.path.forEach((p, i) => parts.push({ text: p.name, onClick: i < state.path.length - 1 ? () => leaveArchive(i + 1) : null }));
      setTitle(parts);
    } else setTitle([{ text: state.mode === 'visible' ? 'FRIEND.VISIBLE' : 'FRIEND.START' }]);

    renderDock();
    $('sidebar').hidden = !isVisible();
    $('list-own').hidden = inArchive();
    $('list-archive').hidden = !inArchive();
    $('message-input').disabled = inArchive();
    ownRowsRelabel();

    renderSidebar();

  }

  $('eye').addEventListener('click', () => {
    if (inArchive()) { state.path = []; state.trail = state.trail.slice(0, 1); state.mode = 'obscured'; }
    else state.mode = state.mode === 'visible' ? 'obscured' : 'visible';
    // Back to start mode: nothing is selected. Into visible mode: the newest bot message is.
    if (state.mode === 'obscured') unselectMessages(listOwn);
    else selectNewestOwn();
    if (state.mode === 'visible' && state.number == null) getCard(state.conversationId).then(c => { if (c) { state.number = c.number; renderHeader(); } });
    renderChrome();

  // ---------- dock ----------
  function renderDock() {
    const dock = $('dock');
    dock.replaceChildren();
    const add = (icon, label, fn) => { const b = el('button', 'px'); b.innerHTML = ICON[icon]; b.setAttribute('aria-label', label); b.title = label; b.addEventListener('click', fn); dock.appendChild(b); };
    if (!state.conversationId) { add('monitor', 'FriendBot', () => {}); return; }
