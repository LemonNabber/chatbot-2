<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FriendBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Cossette+Texte&family=Noto+Sans+JP&family=Noto+Sans+Symbols+2&display=block" rel="stylesheet">
<style>
  /* ============================================================
     FONTS (see the requirements doc: "Fonts", "Which font where")
     Interface = Cossette Texte · The friend = Balsamiq Sans · Data = OT Bulb Monoline
     OT Bulb Monoline is commercial: put its file at fonts/OTBulbMonoline-Regular.woff2.
     ============================================================ */
  @font-face {
    font-family: 'OT Bulb Monoline';
    src: url('fonts/OTBulbMonoline-Regular.woff2') format('woff2'),
         url('fonts/OTBulbMonoline-Regular.otf') format('opentype');
    font-display: block;
  }

  :root {
    --kaomoji: 'Noto Sans JP', 'Noto Sans Symbols 2', sans-serif;
    --f-ui: 'Cossette Texte', 'Arial Narrow', var(--kaomoji);
    --f-friend: 'Balsamiq Sans', 'Comic Neue', var(--kaomoji);
    --f-data: 'OT Bulb Monoline', ui-monospace, monospace, var(--kaomoji);

    /* type scale ("Type scale and sizing") */
    --text-display: 4.5rem;
    --text-xl: 1.375rem;
    --text-lg: 1.125rem;
    --text-md: 1rem;
    --text-sm: 0.875rem;
    --text-xs: 0.75rem;

    /* colour ("Modes and colour") */
    --ink: #050708;
    --paper: #ffffff;
    --chrome: #f2f2f2;
    --line: #a8a8a8;
    --muted: #9a9a9a;
    --tint: #dfe6e4;
    --sidebar: #0b0b0b;
  }

  /* Root size follows the screen so the window scales as one object. */
  html { font-size: clamp(14px, min(1.25vw, 1.9vh), 24px); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #2d5bd6;
    color: var(--ink);
    font-family: var(--f-ui);
    overflow: hidden;
    height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* type roles */
  .f-ui { font-family: var(--f-ui); letter-spacing: 0.02em; }
  .f-friend { font-family: var(--f-friend); }
  .f-data { font-family: var(--f-data); }

  /* ============================================================
     DESKTOP
     ============================================================ */
  #sky {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    display: block; will-change: transform;
  }
  #scanlines {
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0, 10, 40, 0.15) 0 1px, transparent 1px 3px);
  }
  #desktop {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 3.5rem;
  }

  /* ============================================================
     WINDOW
     ============================================================ */
  .window {
    position: relative;
    background: var(--chrome);
    border: 2px solid #000;
    border-radius: 0.75rem;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .window.w-setup { width: 57rem; height: 38rem; }
  .window.w-chat { width: 74rem; height: 47rem; }

  .titlebar {
    height: 2.25rem; flex: none;
    background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1rem;
  }
  .title {
    font-family: var(--f-data);
    font-size: var(--text-md);
    text-transform: uppercase;
    display: flex; gap: 0.5em; white-space: nowrap;
  }
  .title button { text-transform: uppercase; }
  .title button:hover { text-decoration: underline; }
  .eye { width: 1.8rem; height: 1.2rem; color: #fff; display: flex; }
  .eye svg { width: 100%; height: 100%; }

  .window-body {
    flex: 1; min-height: 0;
    display: flex; gap: 0.6rem;
    padding: 1rem;
  }
  .panel {
    position: relative; flex: 1; min-width: 0;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 0.5rem;
    overflow: hidden;
  }
  /* The glow is one opaque layer under everything in the panel (a fading transparent
     edge would be cut hard by the pixel filter). */
  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(38% 34% at 30% 34%, rgba(238, 242, 255, 0.95), rgba(238, 242, 255, 0) 70%),
      radial-gradient(34% 32% at 50% 28%, rgba(255, 244, 220, 0.95), rgba(255, 244, 220, 0) 70%),
      radial-gradient(34% 34% at 70% 36%, rgba(255, 236, 239, 0.95), rgba(255, 236, 239, 0) 70%),
      var(--paper);
  }

  /* ============================================================
     SHARED COMPONENTS
     ============================================================ */
  .headline {
    font-family: var(--f-friend); font-weight: 700;
    font-size: var(--text-display); line-height: 1.05; letter-spacing: -0.01em;
    text-align: center;
  }
  .lead {
    font-family: var(--f-friend);
    font-size: var(--text-xl); line-height: 1.35;
    text-align: center;
  }
  .step-title {
    font-family: var(--f-ui); letter-spacing: 0.02em;
    font-size: var(--text-lg); line-height: 1.2;
    text-transform: uppercase; text-align: center; font-weight: 400;
  }
  .btn {
    font-family: var(--f-ui); letter-spacing: 0.02em;
    font-size: var(--text-lg); line-height: 1.2; text-transform: uppercase;
    min-width: 8rem; padding: 0.55rem 1.4rem;
    background: #ececec;
    border: 2px solid var(--line);
    border-radius: 0.3rem;
  }
  .btn:hover { background: #dddddd; }
  .btn:disabled { color: var(--muted); cursor: default; background: #f4f4f4; }
  .actions {
    position: absolute; left: 0; right: 0; bottom: 1.5rem;
    display: flex; justify-content: center; gap: 1rem;
  }

  /* The user card ("The user card") */
  .card {
    display: inline-flex; flex-direction: column;
    font-family: var(--f-ui); letter-spacing: 0.02em;
    font-size: var(--text-sm); line-height: 1.2; text-transform: uppercase;
    border: 1px solid currentColor;
    background: var(--paper); color: var(--ink);
    white-space: nowrap;
  }
  .card-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.15rem 0.4rem; }
  .card-row + .card-row { border-top: 1px solid currentColor; justify-content: flex-end; }
  .card-row > span { display: flex; align-items: center; gap: 0.2rem; }
  .card .c-mood { text-transform: none; }
  .card .c-dur { margin-left: auto; }
  .card svg { width: 1em; height: 1em; flex: none; }

  .portrait {
    width: 11.5rem; height: 11.5rem; flex: none;
    border: 2px solid var(--line); border-radius: 0.5rem;
    background: var(--tint);
    overflow: hidden;
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .portrait.bot-hidden { background: #000; border: 3px solid #000; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 5px #000; }

  .photo-grey { filter: grayscale(1); } /* used when the pixel filter is off (e.g. Safari) */

  /* ============================================================
     SETUP (FRIEND.BEGIN)
     ============================================================ */
  #setup, #chat { position: absolute; inset: 0; }
  .step { position: absolute; inset: 0; padding: 2rem 5rem; }
  .step-welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4rem; padding-bottom: 7rem; }
  .step-welcome .lead { max-width: 30rem; }
  .step-voice, .step-selfie, .step-mood, .step-name { display: flex; flex-direction: column; align-items: center; }
  .step .step-title { margin-top: 1.2rem; }

  .rail {
    position: absolute; right: 1.2rem; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
    padding: 0.6rem 0.35rem;
    background: var(--paper);
    border: 2px solid #c8c8c8; border-radius: 1.2rem;
    color: #b5b5b5;
  }
  .rail .r-item { width: 1.4rem; height: 1.4rem; display: flex; align-items: center; justify-content: center; }
  .rail .r-item svg { width: 100%; height: 100%; }
  .rail .r-abc { font-family: var(--f-ui); font-size: var(--text-xs); letter-spacing: 0.02em; }
  .rail .r-item.active { color: #000; }

  /* voice */
  .device {
    margin-top: 1.4rem;
    width: 44rem; height: 24.5rem;
    border: 2px solid #c8c8c8; border-radius: 0.35rem;
    background: var(--paper);
    position: relative;
  }
  .graph {
    position: absolute; left: 1rem; right: 1rem; top: 0.8rem; height: 17.5rem;
    background: var(--tint);
    border: 2px solid #b9bfbd; border-radius: 0.3rem;
  }
  .graph canvas { position: absolute; left: 0; top: 0; width: 100%; height: 12.5rem; display: block; }
  .ticks {
    position: absolute; left: 0; right: 0; top: 12.5rem; bottom: 0;
    border-top: 1px solid #000;
    font-family: var(--f-ui); font-size: var(--text-xs); letter-spacing: 0.02em;
  }
  .tick { position: absolute; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; transform: translateX(-50%); }
  .tick::before, .tick::after { content: ""; width: 1px; flex: 1; background: #000; }
  .tick span { padding: 0.15rem 0; }
  .device-foot { position: absolute; left: 1rem; right: 1rem; bottom: 1rem; height: 3rem; display: flex; align-items: center; justify-content: center; }
  .meter { position: absolute; left: 0; bottom: 0.2rem; width: 10rem; display: flex; flex-direction: column; gap: 3px; }
  .meter i { display: block; height: 2px; background: #c4c4c4; width: 100%; transition: width 80ms linear; }
  .meter i.on { background: #555; }
  .pitch-read { position: absolute; left: 11rem; bottom: 0.1rem; font-family: var(--f-ui); font-size: var(--text-xs); letter-spacing: 0.02em; text-transform: uppercase; color: #555; }
  .rec {
    width: 3.1rem; height: 2.4rem;
    background: #ececec; border: 2px solid var(--line); border-radius: 0.35rem;
    display: flex; align-items: center; justify-content: center;
  }
  .rec:hover { background: #dddddd; }
  .rec i { display: block; width: 1rem; height: 1rem; background: #444; border-radius: 50%; }
  .rec.recording i { border-radius: 0.1rem; }
  .setup-error { font-family: var(--f-ui); font-size: var(--text-sm); letter-spacing: 0.02em; text-transform: uppercase; margin-top: 0.8rem; text-align: center; max-width: 40rem; }

  /* selfie */
  .camera-wrap { position: relative; margin-top: 3rem; }
  .shutter {
    position: absolute; left: 1.4rem; top: -0.55rem; width: 7rem; height: 0.55rem;
    background: #000; border-radius: 0.2rem 0.2rem 0 0;
  }
  .shutter-mark { position: absolute; left: 4.3rem; top: -2rem; width: 0; height: 0; border-left: 0.6rem solid transparent; border-right: 0.6rem solid transparent; border-top: 0.6rem solid #000; }
  .camera {
    width: 34rem; height: 19.5rem;
    border: 2px solid #9a9a9a; border-radius: 0.4rem;
    background: var(--paper);
    position: relative;
  }
  .viewfinder { position: absolute; left: 1.2rem; top: 1.1rem; width: 6rem; height: 2.2rem; border: 2px solid #9a9a9a; border-radius: 0.2rem; }
  .viewfinder::after { content: ""; position: absolute; left: 1.2rem; right: 1.2rem; top: 0; bottom: 0; background: #e2e2e2; border-left: 2px solid #9a9a9a; border-right: 2px solid #9a9a9a; }
  .lens-outer {
    position: absolute; right: 2.5rem; top: 1.6rem;
    width: 16rem; height: 16rem; border-radius: 50%;
    border: 2px solid #9a9a9a; background: #ececec;
    display: flex; align-items: center; justify-content: center;
  }
  .lens-ring { width: 13.8rem; height: 13.8rem; border-radius: 50%; border: 2px solid #9a9a9a; display: flex; align-items: center; justify-content: center; }
  .lens {
    width: 11rem; height: 11rem; border-radius: 50%;
    border: 2px solid #9a9a9a; overflow: hidden; background: #ececec;
    display: flex; align-items: center; justify-content: center;
  }
  .lens video, .lens img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .lens .no-photo { width: 6rem; height: 3.6rem; border: 2px solid #9a9a9a; border-radius: 0.4rem; background: linear-gradient(to top right, transparent calc(50% - 1px), #9a9a9a 50%, transparent calc(50% + 1px)); }

  /* mood */
  .kao-grid {
    margin-top: 1rem;
    width: 46rem; height: 22rem;
    border: 2px solid #c8c8c8; border-radius: 0.3rem;
    background: var(--paper);
    overflow-y: auto;
    display: grid; grid-template-columns: repeat(6, 1fr);
    align-content: start;
    font-family: var(--f-ui); font-size: var(--text-lg); letter-spacing: 0.02em;
  }
  .kao {
    height: 3rem; padding: 0 0.3rem;
    border-right: 1px solid #e2e2e2; border-bottom: 1px solid #e2e2e2;
    white-space: nowrap; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .kao:hover { background: #f2f2f2; }
  .kao.selected { background: #dddddd; }

  /* name */
  .step-name { justify-content: center; padding-bottom: 6rem; }
  .name-input {
    width: 41rem; height: 2.8rem;
    border: 2px solid #9a9a9a; border-radius: 0.35rem;
    background: var(--paper);
    font-family: var(--f-ui); letter-spacing: 0.02em; font-size: var(--text-lg);
    text-align: center; outline: none;
  }
  .name-input::placeholder { color: var(--ink); text-transform: uppercase; }
  .name-input:focus::placeholder { color: var(--muted); }
  .name-input:focus { border-color: #000; }

  /* status terminal */
  .status {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 28.5rem; padding: 1rem 1.6rem 1.4rem;
    background: #000; color: #fff; border-radius: 0.4rem;
    z-index: 5;
  }
  .status .face { width: 3rem; height: 2.4rem; color: #fff; }
  .term {
    font-family: var(--f-data); font-size: var(--text-md); line-height: 1.2;
    white-space: pre-wrap; margin-top: 1rem; min-height: 9.6em;
  }
  .progress { margin-top: 1.6rem; height: 2rem; border: 2px solid #fff; }
  .progress i { display: block; height: 100%; width: 0; background: #666; transition: width 400ms ease; }
  .status .btn { margin-top: 1rem; }

  /* ============================================================
     CHAT (FRIEND.START / FRIEND.VISIBLE / ARCHIVE)
     ============================================================ */
  .chat-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .chat-empty .headline { max-width: 26rem; margin-bottom: 4rem; }
  .start-input {
    position: absolute; left: 1.3rem; right: 0.8rem; bottom: 1.1rem;
    border: none; border-bottom: 1px solid #000;
    background: transparent; outline: none;
    font-family: var(--f-ui); letter-spacing: 0.02em; font-size: var(--text-lg);
    padding: 0.2rem 0;
  }
  .start-input::placeholder { color: var(--ink); text-transform: uppercase; }
  .start-input:focus::placeholder { color: var(--muted); }

  .chat-main { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 0.8rem 0.6rem 0.4rem; }
  .chat-head {
    flex: none; height: 19.5rem;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
    padding-top: 7rem;
  }
  .chat-head .portrait { justify-self: center; }
  .head-card { justify-self: center; }
  .visible .chat-head { padding-top: 2.4rem; height: 14.8rem; }

  .list-frame {
    flex: 1; min-height: 0;
    border: 2px solid #c8c8c8; border-radius: 0.3rem;
    background: rgba(255, 255, 255, 0.6);
    padding: 0.4rem 0 0.4rem 0.4rem;
    display: flex;
  }
  .list {
    flex: 1; overflow-y: scroll;
    display: flex; flex-direction: column; gap: 0.5rem;
    padding-right: 0.5rem;
    scrollbar-width: thin; scrollbar-color: var(--line) var(--chrome);
  }
  .list::-webkit-scrollbar { width: 0.8rem; }
  .list::-webkit-scrollbar-track { background: var(--chrome); border: 1px solid #c8c8c8; }
  .list::-webkit-scrollbar-thumb {
    border: 1px solid var(--line);
    background: repeating-linear-gradient(to bottom, #fff 0 2px, var(--line) 2px 3px);
  }

  .row {
    flex: none;
    display: flex; align-items: baseline; gap: 2rem;
    min-height: 2.5rem; padding: 0.5rem 1.1rem;
    border: 2px solid var(--line); border-radius: 0.25rem;
    background: var(--paper); color: var(--ink);
  }
  .row.bot { background: var(--ink); border-color: var(--ink); color: #fff; }
  .row-label {
    flex: none; font-family: var(--f-ui); letter-spacing: 0.02em;
    font-size: var(--text-lg); line-height: 1.2; text-transform: uppercase;
  }
  .row-msg { flex: 1; text-align: right; font-size: var(--text-lg); line-height: 1.35; overflow-wrap: anywhere; }
  .row.context { background: transparent; border: 1px solid #c8c8c8; color: var(--muted); }

  .visible .src-group .row.bot { cursor: pointer; }
  .src-group.open { border: 1px solid #c8c8c8; padding: 0 0.5rem 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .src-head { display: flex; justify-content: space-between; align-items: flex-start; margin: 0 -0.5rem; }
  .enter {
    font-family: var(--f-ui); letter-spacing: 0.02em; font-size: var(--text-sm); text-transform: uppercase;
    border: 1px solid currentColor; padding: 0.1rem 0.4rem; background: var(--paper);
  }
  .enter:hover { background: #ececec; }

  .msg-input {
    flex: none; height: 3rem;
    border: none; outline: none; background: transparent;
    font-family: var(--f-ui); letter-spacing: 0.02em; font-size: var(--text-lg);
    padding: 0 0.6rem;
  }
  .msg-input:disabled { color: var(--muted); }

  /* visible sidebar */
  .sidebar {
    width: 17.5rem; flex: none;
    background: var(--sidebar);
    border: 2px solid #2a2a2a; border-radius: 0.5rem;
    padding: 0.8rem 0.7rem;
    display: flex; flex-direction: column; gap: 0.6rem;
    color: #fff;
  }
  .people { display: flex; align-items: center; gap: 0.35rem; color: #6d6d6d; min-height: 1.5rem; }
  .people button { width: 1.5rem; height: 1.5rem; display: flex; }
  .people button.sel { color: #fff; }
  .people svg { width: 100%; height: 100%; }
  .people .count { margin-left: auto; font-family: var(--f-ui); font-size: var(--text-sm); color: #fff; }
  .side-card .card { background: var(--sidebar); color: #fff; width: 100%; }
  .slots { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.3rem; }
  .slot {
    position: relative;
    clip-path: polygon(0 0, 78% 0, 100% 16%, 100% 100%, 0 100%);
    background: #141414;
    transition: transform 160ms ease;
  }
  .slot.filled { background: #3c423f; cursor: pointer; padding: 0.5rem 0.5rem 1rem; }
  .slot.filled::after { content: ""; position: absolute; left: 0.3rem; right: 0.3rem; bottom: 0.3rem; height: 0.2rem; background: #8e8e8e; }
  .slot.sel { transform: translateY(-0.7rem); background: #8f9c93; }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 0.3rem; }

  /* ARCHIVE: the colour flip */
  .archive .panel { background: #000; border-color: #5a5a5a; color: #fff; }
  .archive .glow {
    background:
      radial-gradient(38% 34% at 30% 34%, rgba(70, 70, 70, 0.8), rgba(70, 70, 70, 0) 70%),
      radial-gradient(34% 32% at 50% 28%, rgba(90, 90, 90, 0.8), rgba(90, 90, 90, 0) 70%),
      radial-gradient(34% 34% at 70% 36%, rgba(60, 60, 60, 0.8), rgba(60, 60, 60, 0) 70%),
      #000;
  }
  .archive .list-frame { background: transparent; border-color: #5a5a5a; }
  .archive .row.bot { border-color: #fff; }
  .archive .row.context { border-color: #5a5a5a; }
  .archive .head-card .card, .archive .src-head .card { background: #000; color: #fff; }
  .archive .enter { background: #000; }
  .archive .enter:hover { background: #222; }
  .archive .src-group.open { border-color: #5a5a5a; }
  .archive .msg-input { color: #fff; }
  .archive .list { scrollbar-color: #5a5a5a #000; }
  .archive .list::-webkit-scrollbar-track { background: #000; border-color: #5a5a5a; }

  /* ============================================================
     DOCK
     ============================================================ */
  .dock {
    position: fixed; left: 50%; bottom: 0.6rem; transform: translateX(-50%);
    display: flex; gap: 0.8rem; align-items: flex-end;
  }
  .dock button { width: 3.4rem; height: 2.8rem; display: flex; }
  .dock svg { width: 100%; height: 100%; }

  /* pixel effect on/off, bottom right */
  .pixel-toggle {
    position: fixed; right: 1rem; bottom: 1rem;
    font-family: var(--f-ui); letter-spacing: 0.02em; font-size: var(--text-xs); text-transform: uppercase;
    padding: 0.3rem 0.6rem;
    background: var(--chrome); border: 2px solid #000; border-radius: 0.3rem;
  }
  .pixel-toggle:hover { background: #dddddd; }
</style>
</head>
<body>

<canvas id="sky" class="px-img" data-px-width="1" aria-hidden="true"></canvas>
<div id="scanlines" aria-hidden="true"></div>

<main id="desktop">
  <section id="window" class="window w-setup">
    <header class="titlebar px">
      <div id="title" class="title"></div>
      <button id="eye" class="eye" hidden aria-label="Show where the bot's words come from"></button>
    </header>

    <div class="window-body">
      <!-- visible-mode sidebar -->
      <aside id="sidebar" class="sidebar" hidden>
        <div id="people" class="people px" data-px-extra="#6d6d6d #fff"></div>
        <div id="side-card" class="side-card"></div>
        <div id="slots" class="slots"></div>
      </aside>

      <div id="panel" class="panel">

        if (t - segStart >= 0.5 || t >= RECORD_SECONDS || !recording) {
          frames.sort((a, b) => a - b);
          segments.push({ t0: segStart, t1: Math.min(t, RECORD_SECONDS), hz: frames.length >= 2 ? frames[frames.length >> 1] : null });
          frames.length = 0; segStart = t;
        }
        drawGraph(wave, segments, Math.min(1, t / RECORD_SECONDS));
        if (t < RECORD_SECONDS && recording) requestAnimationFrame(frame); else resolve();
      }
      requestAnimationFrame(frame);
    });
    recording = false;
    recorder.stop();
    await stopped;
    stream.getTracks().forEach(t => t.stop());
    src.disconnect();
    meter.forEach(m => { m.classList.remove('on'); m.style.width = ''; });
    $('rec-btn').classList.remove('recording');
    $('rec-btn').setAttribute('aria-label', 'Record again');

    let audio;
    try {
      const blob = new Blob(chunks, { type: recorder.mimeType });
      audio = await ctx.decodeAudioData(await blob.arrayBuffer());
    } catch (err) {
      console.error(err);
      showVoiceError('Something went wrong reading the recording. Please try again.');
      return;
    }
    // The recording only ever exists in this function. It is never uploaded.

    const result = detectPitch(audio.getChannelData(0), audio.sampleRate);
    if (!result.pitch) {
      showVoiceError({
        quiet: 'That was too quiet. Try again a little louder, or closer to the microphone.',
        unclear: "Couldn't hear a clear voice. Try again and hold the \"hel-\": \"hellooo\"."
      }[result.reason] || 'Please try again.');
      return;
    }
    state.voicePitch = result.pitch;
    $('pitch-read').textContent = Math.round(result.pitch) + ' HZ';
    $('voice-continue').hidden = false;
    sayInVoice('hello!', state.voicePitch);
  }

  // ============================================================
  // VOICE: pitch detection
  // ============================================================
  // Finds the pitch (Hz) of the loudest part of a recording.
  function detectPitch(samples, sampleRate) {
    const frameLen = Math.round(0.04 * sampleRate);
    const hop = Math.round(0.01 * sampleRate);
    const rms = [];
    for (let s = 0; s + frameLen <= samples.length; s += hop) {
      let sum = 0;
      for (let j = 0; j < frameLen; j++) sum += samples[s + j] * samples[s + j];
      rms.push(Math.sqrt(sum / frameLen));
    }
    if (!rms.length) return { reason: 'quiet' };
    let loudest = 0;
    for (let i = 1; i < rms.length; i++) if (rms[i] > rms[loudest]) loudest = i;
    const maxRms = rms[loudest];
    if (maxRms < 0.01) return { reason: 'quiet' };
    const pitches = [];
    const from = Math.max(0, loudest - 15), to = Math.min(rms.length - 1, loudest + 15);
    for (let i = from; i <= to; i++) {
      if (rms[i] < 0.5 * maxRms) continue;
      const p = framePitch(samples, i * hop, frameLen, sampleRate);
      if (p) pitches.push(p);
    }
    if (pitches.length < 3) return { reason: 'unclear' };
    pitches.sort((a, b) => a - b);
    return { pitch: pitches[Math.floor(pitches.length / 2)] };
  }

  // Pitch of one slice, or null if it isn't clearly voiced. Range: 70-500 Hz.
  function framePitch(x, start, n, sampleRate) {
    const minLag = Math.floor(sampleRate / 500);
    const maxLag = Math.ceil(sampleRate / 70);
    const w = n - maxLag - 1; // compare equal-length windows for every lag
    if (w <= 0) return null;
    const corr = new Float32Array(maxLag + 2);
    let best = -1;
    for (let lag = minLag; lag <= maxLag + 1; lag++) {
      let num = 0, e1 = 0, e2 = 0;
      for (let j = 0; j < w; j++) {
        const a = x[start + j], b = x[start + j + lag];
        num += a * b; e1 += a * a; e2 += b * b;
      }
      const r = (e1 && e2) ? num / Math.sqrt(e1 * e2) : 0;
      corr[lag] = r;
      if (lag <= maxLag && r > best) best = r;
    }
    if (best < 0.6) return null;
    // first peak that is nearly as strong as the best one (avoids octave errors)
    for (let lag = minLag + 1; lag <= maxLag; lag++) {
      if (corr[lag] >= 0.9 * best && corr[lag] >= corr[lag - 1] && corr[lag] >= corr[lag + 1]) {
        const y0 = corr[lag - 1], y1 = corr[lag], y2 = corr[lag + 1];
        const denom = y0 - 2 * y1 + y2;
        const shift = denom ? (y0 - y2) / (2 * denom) : 0;
        return sampleRate / (lag + shift);
      }
    }
    return null;
  }

  // ============================================================
  // VOICE: letter sounds (Animalese-style)
  // Each letter is a tiny syllable at the speaker's pitch: a vowel colour
  // (from how the letter's name sounds), an onset, and its own pitch step.
  // ============================================================
  const VOWEL_FORMANTS = { a: [730, 1090], e: [530, 1840], i: [270, 2290], o: [570, 840], u: [300, 870] };
  const LETTER_SOUNDS = {
    a: { v: 'e', on: 'none', st: 0 }, b: { v: 'i', on: 'pop', st: 2 }, c: { v: 'i', on: 'hiss', st: -1 },
    d: { v: 'i', on: 'pop', st: -2 }, e: { v: 'i', on: 'none', st: 3 }, f: { v: 'e', on: 'soft', st: -1 },
    g: { v: 'i', on: 'sh', st: 1 }, h: { v: 'e', on: 'soft', st: 2 }, i: { v: 'a', on: 'none', st: 1 },
    j: { v: 'e', on: 'sh', st: -2 }, k: { v: 'e', on: 'pop', st: 3 }, l: { v: 'e', on: 'liquid', st: -1 },
    m: { v: 'e', on: 'nasal', st: -3 }, n: { v: 'e', on: 'nasal', st: 0 }, o: { v: 'o', on: 'none', st: -1 },
    p: { v: 'i', on: 'pop', st: 0 }, q: { v: 'u', on: 'pop', st: 2 }, r: { v: 'a', on: 'liquid', st: -2 },
    s: { v: 'e', on: 'hiss', st: 1 }, t: { v: 'i', on: 'pop', st: 4 }, u: { v: 'u', on: 'none', st: 2 },
    v: { v: 'i', on: 'liquid', st: -3 }, w: { v: 'u', on: 'liquid', st: 0 }, x: { v: 'e', on: 'hiss', st: -2 },
    y: { v: 'a', on: 'liquid', st: 3 }, z: { v: 'i', on: 'hiss', st: 2 }
  };
  const OTHER_SOUND = { v: 'o', on: 'pop', st: 0 };
  const ONSETS = {
    pop:  { type: 'bandpass', freq: 3000, q: 1, peak: 0.6, len: 0.015, delay: 0.01 },
    hiss: { type: 'highpass', freq: 5000, q: 0.7, peak: 0.35, len: 0.035, delay: 0.025 },
    sh:   { type: 'bandpass', freq: 2500, q: 2, peak: 0.4, len: 0.035, delay: 0.025 },
    soft: { type: 'bandpass', freq: 1400, q: 1, peak: 0.25, len: 0.03, delay: 0.02 }
  };

  let audioCtx = null, masterGain = null, noiseBuffer = null;
  function getAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      const compressor = audioCtx.createDynamicsCompressor();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.6;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);
      noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const d = noiseBuffer.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playLetter(ch, basePitch, dur, bendSemitones) {
    const ctx = getAudioCtx();
    const s = LETTER_SOUNDS[ch] || OTHER_SOUND;
    const [f1, f2] = VOWEL_FORMANTS[s.v];
    const freq = basePitch * VOICE_PITCH_MULTIPLIER * Math.pow(2, (s.st + bendSemitones) / 12);
    const t = ctx.currentTime + 0.005;
    const onset = ONSETS[s.on];
    if (onset) {
      const src = ctx.createBufferSource(); src.buffer = noiseBuffer;
      const filt = ctx.createBiquadFilter(); filt.type = onset.type; filt.frequency.value = onset.freq; filt.Q.value = onset.q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(onset.peak, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + onset.len);
      src.connect(filt); filt.connect(g); g.connect(masterGain);
      src.start(t, Math.random() * 0.5); src.stop(t + onset.len + 0.01);
    }
    const vs = t + (onset ? onset.delay : 0);
    const vd = Math.max(0.03, dur * 1.1 - (vs - t));
    const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = freq;
    const bp1 = ctx.createBiquadFilter(); bp1.type = 'bandpass'; bp1.frequency.value = f1; bp1.Q.value = 5;
    const bp2 = ctx.createBiquadFilter(); bp2.type = 'bandpass'; bp2.frequency.value = f2; bp2.Q.value = 7;
    const body = ctx.createBiquadFilter(); body.type = 'lowpass'; body.frequency.value = 1200;
    if (s.on === 'liquid' || s.on === 'nasal') {
      bp2.frequency.setValueAtTime(f2 * 0.6, vs); bp2.frequency.linearRampToValueAtTime(f2, vs + 0.03);
      if (s.on === 'nasal') { bp1.frequency.setValueAtTime(250, vs); bp1.frequency.linearRampToValueAtTime(f1, vs + 0.03); }
    }
    const g1 = ctx.createGain(); g1.gain.value = 2.5;
    const g2 = ctx.createGain(); g2.gain.value = 1.8;
    const gb = ctx.createGain(); gb.gain.value = 0.15;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, vs); env.gain.linearRampToValueAtTime(1, vs + 0.008);
    env.gain.setValueAtTime(1, vs + vd * 0.55); env.gain.exponentialRampToValueAtTime(0.0001, vs + vd);
    osc.connect(bp1); bp1.connect(g1); g1.connect(env);
    osc.connect(bp2); bp2.connect(g2); g2.connect(env);
    osc.connect(body); body.connect(gb); gb.connect(env);
    env.connect(masterGain);
    osc.start(vs); osc.stop(vs + vd + 0.01);
    osc.onended = () => env.disconnect();
  }

  // Types text into an element one character at a time, playing a sound per letter.
  function typeOut(target, text, getPitch, onChar) {
    const chars = Array.from(text);
    const isLetter = c => /[\p{L}\p{N}]/u.test(c);
    const totalLetters = chars.filter(isLetter).length;
    const endsWithQuestion = /\?\s*$/.test(text);
    const step = Math.min(0.07, Math.max(0.035, 9 / chars.length));
    const pitch = getPitch() || DEFAULT_VOICE_PITCH;
    return new Promise(resolve => {
      let i = 0, lettersSoFar = 0;
      function tick() {
        if (i >= chars.length) { resolve(); return; }
        const ch = chars[i++];
        target.textContent += ch;
        let delay = step;
        if (isLetter(ch)) {
          lettersSoFar++;
          let bend = 0;
          if (endsWithQuestion) { const fromEnd = totalLetters - lettersSoFar; if (fromEnd < 4) bend = (4 - fromEnd) * 1.5; }
          if (soundOn) playLetter(ch.toLowerCase(), pitch, step, bend);
        } else if (/[.,!?;:]/.test(ch)) delay = step * 3;
        if (onChar) onChar();
        setTimeout(tick, delay * 1000);
      }
      tick();
    });
  }
  function sayInVoice(text, pitch) { return typeOut(document.createElement('span'), text, () => pitch); }

  // Messages speak one after another, never on top of each other.
  let speechQueue = Promise.resolve();
  function enqueueSpeech(fn) {
    speechQueue = speechQueue.then(fn).catch(err => console.error(err));
    return speechQueue;
  }
</script>
